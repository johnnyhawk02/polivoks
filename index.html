<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FILTH — Polivoks circuit model</title>
<meta name="theme-color" content="#fc0fc0">
<!-- installable on a phone (manifest + sw.js); the iOS tags are for Add to Home Screen in Safari -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FILTH">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>
// two views of the same synth: the 3D panel (view3d.js, the main view) or
// the flat 2D panel.  ?view=2d / ?view=3d picks one and is remembered.
(() => { let v = new URLSearchParams(location.search).get('view');
  try { if (v) localStorage.setItem('polivoks-view', v); else v = localStorage.getItem('polivoks-view'); } catch (e) {}
  if (v !== '2d') document.documentElement.classList.add('v3d'); })();
</script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Archivo+Black&family=Rubik:wght@900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Look from johnnyhawk.org, kept calm: flat hot pink panels with straight
     edges, black controls, heavy all-caps names on plain black slabs, small
     letter-spaced mono labels. */
  :root {
    --pink: #fc0fc0; --ink: #0b0b0b; --paper: #fff;
    --display: "Archivo Black", "Rubik", "Arial Black", sans-serif;
    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; overflow-x: hidden; color: var(--paper); font-family: var(--mono);
    background-color: var(--ink);
  }
  /* the panels are flat hot pink */
  ::selection { background: var(--ink); color: var(--paper); }
  /* One grid for the whole panel: every control sits in a cell of the same
     size (--cw wide, --rh tall), cells are --g apart, and each section box
     spans whole cells.  Knob centres, switch slots and labels all sit at the
     same height in every cell. */
  #stage { --cw: 78px; --rh: 110px; --g: 8px; --top: 18px;
    transform-origin: 0 0; width: calc(19 * var(--cw) + 18 * var(--g) + 88px); padding: 14px 26px 0; }
  .panel { display: grid; grid-template-columns: repeat(19, var(--cw)); grid-template-rows: repeat(3, var(--rh)); gap: var(--g);
    padding: 18px; position: relative; isolation: isolate; color: var(--ink); }
  .torn { position: absolute; inset: 0; z-index: -1; background: var(--pink); pointer-events: none; }
  .box { box-shadow: inset 0 0 0 2px var(--ink); position: relative; display: grid; grid-template-columns: repeat(var(--n), var(--cw)); grid-template-rows: repeat(var(--m, 1), var(--rh)); gap: var(--g); grid-auto-flow: row; }
  .box.down { grid-auto-flow: column; }
  /* FILTER, MIXER, AMPLIFIER: their own grid, equal columns, shorter rows from the top */
  #stage { --orh: 94px; }
  .box.own { grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--m, 1), var(--orh)); align-content: start; row-gap: 0; padding-top: 10px; }
  .box.own .ctl, .box.own .sw, .box.own .resp { width: auto; height: var(--orh); padding-top: 8px; }
  /* section names: white letters on a plain black slab over the top edge */
  .box h2 {
    position: absolute; top: -10px; left: 10px; margin: 0;
    font: 400 14px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; color: var(--paper);
    padding: 4px 8px 3px; background: var(--ink);
  }
  /* a cell: 62 px of control, then two lines kept for the label */
  /* dashed cell = a control added to the model, not on the original panel */
  .ctl.added { outline: 1.5px dashed var(--ink); outline-offset: -3px; }
  .ctl, .sw, .resp { width: var(--cw); height: var(--rh); padding-top: var(--top); display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none; }
  .ctl { touch-action: none; }
  .led { --on: 0; width: 18px; height: 18px; margin: 24px 0 20px; border-radius: 50%; border: 2px solid var(--ink);
    background: color-mix(in srgb, #ff2a2a calc(var(--on) * 100%), #3a0008); box-shadow: 0 0 calc(var(--on) * 14px) calc(var(--on) * 4px) rgba(255, 40, 40, calc(var(--on) * .9)); }
  .ctl svg { display: block; cursor: ns-resize; overflow: visible; }
  .lab { font: 500 10.5px/12px var(--mono); text-transform: uppercase; letter-spacing: .07em; text-align: center; margin-top: 2px; white-space: nowrap; height: 24px; }
  .ctl svg text { fill: var(--ink); font-family: var(--mono); font-size: 9.5px; }
  .sw { cursor: pointer; }
  .sw .grp { height: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .sw .slot { width: 18px; height: 32px; border: 2px solid var(--ink); position: relative; }
  .sw .lev { --lh: 12px; position: absolute; left: 2px; right: 2px; height: var(--lh); background: var(--ink); transition: top .08s; }
  .sw .t { font: 500 10px/12px var(--mono); text-transform: uppercase; letter-spacing: .06em; text-align: center; }
  .ttl { display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--paper);
    font: 400 86px/1 var(--display); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
  /* below the synth: a second pink panel on the same 19 columns, then a thin
     white strip for read-outs.  Every control down here is a "field": a small
     label over a 30 px control, one or more cells wide. */
  .low { grid-template-rows: auto auto; margin-top: 12px; row-gap: 22px; }
  .low .box { display: grid; grid-template-columns: repeat(var(--n), var(--cw)); grid-template-rows: none; grid-auto-rows: auto;
    gap: 10px var(--g); padding: 22px 0 12px; align-content: start; }
  .f { display: flex; flex-direction: column; gap: 4px; margin: 0 8px; min-width: 0; }
  .f > span { font: 500 10.5px/12px var(--mono); text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f .row { display: flex; align-items: center; gap: 4px; height: 30px; }
  /* buttons in a field several cells wide still sit one per cell */
  .f .row.cells { gap: calc(var(--g) + 16px); }
  .btn, .sb {
    height: 30px; width: 100%; cursor: pointer; border: 0; background: var(--ink); color: var(--paper);
    font: 400 12px/1 var(--display); text-transform: uppercase; letter-spacing: 0; padding: 0 2px;
    white-space: nowrap; touch-action: manipulation; min-width: 0; overflow: hidden;
  }
  .btn:hover, .sb:hover { color: var(--pink); }
  .sb.lit { color: var(--pink); }
  .sb.sm { width: 30px; flex: none; }
  .val { flex: 1; text-align: center; font: 600 12px var(--mono); letter-spacing: .04em; white-space: nowrap; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  .f input[type=range] { flex: 1; min-width: 0; margin: 0; accent-color: var(--ink); }
  .f select { height: 30px; flex: 1; min-width: 0; border: 0; background: var(--ink); color: var(--paper); font: 400 13px var(--display); text-transform: uppercase; padding: 0 6px; cursor: pointer; }
  /* knob step sequences (performance feature): label on a black slab while one runs */
  .ctl .lab.seq { background: var(--ink); color: var(--pink); padding: 1px 5px; }
  .sq-grid { grid-column: 1 / -1; margin: 0 8px; display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; height: 104px; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
  .bar { position: relative; border: 2px solid var(--ink); transition: background-color .35s, box-shadow .35s; }
  .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px dashed var(--ink); }
  .bar i { position: absolute; left: 0; right: 0; background: var(--ink); }
  .bar.off { opacity: .25; }
  /* the knob shown in the sequencer is not running: its settings and steps are greyed out */
  #seqpanel.idle .dim { opacity: .35; }
  /* the running light: the step playing now lights up white and glows, then fades as the next one lights */
  .bar.now { background: rgba(255,255,255,.4); box-shadow: 0 0 8px 1px rgba(255,255,255,.35); z-index: 1; transition: none; }
  /* preset names are made up by names.js, never typed */
  .pre-name { flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: 2px solid var(--ink); font: 400 13px var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .pre-name > i { font-style: normal; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pre-name > b { font: 600 11px var(--mono); }
  .pre-name.kept { background: var(--paper); }
  .foot { margin: 12px -26px 0; padding: 8px 44px 9px; background: var(--paper); color: var(--ink); display: flex; gap: 24px;
    font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .1em; }
  .foot b { font-weight: 600; }
  .foot a { color: inherit; }
  /* fields that continue the row above need no label line of their own */
  .f.nolab > span { display: none; }
  /* OPTIONS: a box that opens when FILTH is tapped */
  .ttl { cursor: pointer; }
  #opts { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: none; }   /* no dimming: the colours show in place */
  #opts.open { display: flex; }
  #opts .win { position: relative; width: min(520px, 92vw); background: var(--pink); color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); padding: 30px 22px 10px; font-family: var(--mono); }
  #opts h2 { position: absolute; top: -12px; left: 14px; margin: 0; font: 400 18px/1 var(--display); letter-spacing: .03em; color: var(--paper); background: var(--ink); padding: 5px 10px 4px; }
  #opts .x { position: absolute; top: -14px; right: 14px; width: 34px; height: 30px; font-size: 16px; }   /* on the top edge, like the name */
  #opts .f { margin: 0 0 16px; }
  #opts .f > span { font-size: 13px; line-height: 15px; }
  #opts .row { height: 34px; gap: 12px; }
  #opts input[type=range] { flex: 1; min-width: 0; accent-color: var(--ink); }
  #opts .row.cells { gap: 8px; }
  /* a phone on its side: tighter rows so the whole box fits */
  @media (max-height: 520px) { #opts .val { width: 58px !important; } #opts .sq-bpmv { width: 84px !important; } #opts .win { padding: 22px 18px 4px; width: min(1100px, 96vw) !important; display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; } #opts .f > span { width: 118px; } #opts .f { margin-bottom: 0; } #opts .row { height: 32px; } #opts .f > span, #opts .val { font-size: 12px; } #opts .row.cells .sb { height: 26px; font-size: 13px; } #opts input[type=color] { height: 24px; } }
  #opts .row.cells .sb { flex: 1; height: 30px; }
  #opts .val { flex: none; width: 82px; text-align: right; font-size: 14px; }
  #opts input[type=color] { flex: none; width: 46px; height: 30px; padding: 0; border: 2px solid var(--ink); background: none; cursor: pointer; }
  /* one line per setting: name on the left, controls on the right */
  #opts .win { width: min(640px, 94vw); padding-top: 24px; }
  #opts .f { display: flex; flex-direction: row; align-items: center; gap: 12px; margin: 0 0 8px; }
  #opts .f > span { flex: none; width: 140px; }
  #opts .row { flex: 1; min-width: 0; }
  #opts .hue { -webkit-appearance: none; appearance: none; height: 16px; border: 2px solid var(--ink); background: linear-gradient(to right, hsl(0 97% 52%), hsl(60 97% 52%), hsl(120 97% 52%), hsl(180 97% 52%), hsl(240 97% 52%), hsl(300 97% 52%), hsl(360 97% 52%)); }
  #opts .hue::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 28px; background: var(--ink); border: 2px solid var(--paper); }
  #opts .hue::-moz-range-thumb { width: 14px; height: 28px; background: var(--ink); border: 2px solid var(--paper); border-radius: 0; }
  /* 3D view: the 2D panel keeps working underneath, unseen; view3d.js draws it in 3D and drives its controls */
  .v3d body { height: 100vh !important; overflow: hidden; }
  .v3d #stage { visibility: hidden; position: fixed; left: 0; top: 0; pointer-events: none; z-index: -1; }
  /* the 3D view lays the same panel out with more room around every control */
  .v3d #stage { --cw: 92px; --rh: 138px; --g: 10px; --orh: 118px; }
  /* and bigger lettering: the 3D view paints its text at these sizes */
  .v3d .lab { font-size: 15px; line-height: 17px; height: 36px; white-space: normal; }
  .v3d .sw .t { font-size: 13px; line-height: 14px; }
  .v3d .sw .grp { height: 68px; }
  .v3d .ctl svg { margin-bottom: 12px; }   /* bigger knobs in 3D: labels sit lower */
  .v3d .led { margin: 30px 0 26px; }
  .v3d .box h2 { font-size: 18px; }
  .v3d .f > span { font-size: 14px; line-height: 16px; }
  .v3d .val { font-size: 15px; }
  .v3d .f .row { height: 36px; }
  .v3d .btn, .v3d .sb, .v3d .f select, .v3d .pre-name { height: 36px; font-size: 15px; }
  .v3d .sb.sm { width: 36px; }
  .v3d .pre-name, .v3d .f select { font-size: 16px; }
  .v3d .pre-name > b { font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <div class="panel" id="panel">
    <div class="torn"></div>
    <!-- 19 columns × 3 rows of equal cells; each box spans whole cells -->
    <div class="box" id="g-mod" style="grid-area:1/1/2/4;--n:3;--m:1"><h2>MODULATOR</h2></div>
    <div class="box" id="g-perf" style="grid-area:2/1/4/4;--n:3;--m:2"><h2>MASTER</h2></div>
    <div class="box" id="g-o1" style="grid-area:1/4/2/10;--n:6;--m:1"><h2>VCO I</h2></div>
    <div class="box" id="g-o2" style="grid-area:2/4/3/10;--n:6;--m:1"><h2>VCO II</h2></div>
    <div class="box down" id="g-mix" style="grid-area:1/10/3/12;--n:2;--m:2"><h2>MIXER</h2></div>
    <div class="box" id="g-echo" style="grid-area:3/4/4/12;--n:8;--m:1"><h2>ECHO</h2></div>
    <div class="box" id="g-f" style="grid-area:1/12/4/16;--n:4;--m:3"><h2>FILTER</h2></div>
    <div class="ttl" style="grid-area:1/16/2/20"><span id="ttlw">FILTH</span></div>
    <!-- the title's wobble: a fixed noise displacement whose depth is the modulator's output -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wobf" x="-10%" y="-25%" width="120%" height="150%"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="7"/><feDisplacementMap id="wobd" in="SourceGraphic" scale="0" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
    <div class="box" id="g-a" style="grid-area:2/16/4/20;--n:4;--m:2"><h2>AMPLIFIER</h2></div>
  </div>
  <div class="panel low" id="low">
    <div class="torn"></div>
    <div class="box" id="seqpanel" style="grid-area:1/1/3/14;--n:13" aria-label="Knob sequencer"><h2>SEQUENCER</h2></div>
    <div class="box" id="g-pre" style="grid-area:1/14/2/20;--n:6"><h2>PRESETS</h2>
      <div class="f" style="grid-column:span 6"><span>PRESET</span><div class="row"><button class="sb sm" id="pre-prev" aria-label="Previous preset">◀</button><div class="pre-name" id="pre-name"><i></i><b id="pre-n"></b></div><button class="sb sm" id="pre-next" aria-label="Next preset">▶</button></div></div>
      <div class="f nolab" style="grid-column:span 3"><span>&nbsp;</span><div class="row"><select id="pre-list" aria-label="Saved presets"></select></div></div>
      <div class="f nolab" style="grid-column:span 1"><span>&nbsp;</span><div class="row"><button class="btn" id="pre-roll" aria-label="New name">NEW</button></div></div>
      <div class="f nolab" style="grid-column:span 1"><span>&nbsp;</span><div class="row"><button class="btn" id="pre-save">SAVE</button></div></div>
      <div class="f nolab" style="grid-column:span 1"><span>&nbsp;</span><div class="row"><button class="btn" id="pre-del">DELETE</button></div></div>
    </div>
    <div class="box" id="g-rnd" style="grid-area:2/14/3/20;--n:6"><h2>RANDOMISE</h2>
      <div class="f" style="grid-column:span 3"><span>SOUND</span><div class="row cells"><button class="btn" id="rnd-tone">TONE</button><button class="btn" id="rnd-patch">PATCH</button><button class="btn" id="rnd-nudge">NUDGE</button></div></div>
      <div class="f" style="grid-column:span 2"><span>SEQUENCES</span><div class="row cells"><button class="btn" id="rnd-groove">GROOVE</button><button class="btn" id="rnd-mess">MESS</button></div></div>
    </div>
  </div>
  <!-- no longer on the panel (clock/MIDI read-outs, external input, reset, wobble switch): kept unseen so their code still runs -->
  <div id="spare" hidden><b class="val sq-src" style="text-align:left">INTERNAL</b><b class="val" id="midi">—</b><span id="octv">4</span><span id="extname">EXT. INPUT</span><button class="btn" id="extbtn">LOAD FILE</button><input type="file" id="extfile" accept="audio/*" hidden><button class="btn" id="resetbtn">RESET</button><button class="sb" id="wobbtn" aria-pressed="true">ON</button></div>
  <div class="foot">
    <span>Engine: <b id="emode">off</b></span>
    <span style="margin-left:auto"><a href="?view=3d">3D VIEW</a></span>
    <span>FILTH v<b id="ver"></b></span>
  </div>
</div>

<script type="text/plain" id="dsp-src">// ============================================================================
//  Polivoks circuit model — DSP core
//  Every block is solved from the equations of its circuit, not from
//  "musical" approximations. Values come from the factory schematics
//  (sheets 1, 3, 5, 7, 8, 9, 10, 11) and the uA776 / К140УД12 datasheet.
//  Where a value is unreadable or unpublished it is marked EST (estimated).
// ============================================================================

const K_Q = 8.617333262e-5;            // Boltzmann / electron charge  [V/K]
const VT_OF = (T) => K_Q * T;          // thermal voltage kT/q
const LN2 = Math.LN2;

function clamp(x, lo, hi) { return x < lo ? lo : x > hi ? hi : x; }

// Op-amp output stage: linear until close to the rail, then saturates.
function rail(x, vs) {
  const r = x / vs, a = r < 0 ? -r : r;
  if (a < 0.7) return x;
  const a2 = a * a, a4 = a2 * a2, a8 = a4 * a4;
  return x / Math.pow(1 + a8, 0.125);
}

// Pot tapers ----------------------------------------------------------------
// 'A' (log) taper resistance, p in 0..1
function potA(p, rmin, rmax) { const k = 5; return rmin + (rmax - rmin) * (Math.exp(k * p) - 1) / (Math.exp(k) - 1); }

// Small fast RNG (xorshift32) ------------------------------------------------
class Rng {
  constructor(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
  u() { let s = this.s; s ^= s << 13; s ^= s >>> 17; s ^= s << 5; this.s = s >>> 0; return this.s / 4294967296; }
  g() { return (this.u() + this.u() + this.u() + this.u() - 2) * 1.7320508; } // ~N(0,1)
}

// ============================================================================
//  Exponential converter: matched NPN pair (КР198НТ1А) with bulk emitter
//  resistance rb.  ΔVbe = VT·ln(I/Iref) + rb·(I − Iref)   solved by Newton.
//  The divider is calibrated at Tcal; when the chip is at T≠Tcal the scaling
//  drifts exactly as a real uncompensated converter does.
// ============================================================================
class ExpoPair {
  constructor(Iref, rb, Tcal) { this.Iref = Iref; this.rb = rb; this.VTcal = VT_OF(Tcal); this.x = 0; }
  // octaves -> collector current at chip temperature T
  current(oct, T) {
    const dv = oct * this.VTcal * LN2;          // calibrated 1 V/oct divider output
    const VT = VT_OF(T), k = this.rb * this.Iref;
    let x = this.x;
    for (let i = 0; i < 3; i++) {
      const e = Math.exp(x);
      x -= (VT * x + k * (e - 1) - dv) / (VT + k * e);
    }
    this.x = x;
    return this.Iref * Math.exp(x);
  }
}

// ============================================================================
//  VCO (sheet 5, У2/У3).  Transcribed and checked in ngspice (spice/vco/).
//  C5 5600 pF hangs from Vref (A6: 12.5 V·10k/12.21k = 10.24 V) to node X;
//  the expo collector sinks I from X, so X ramps DOWN and the cap voltage
//  vc = Vref − X ramps up.  A7 buffers X (saw test point, 0 … +10 V).
//  Reset: V1 (КТ361Г) + V5 (КТ315Г) form a PNP/NPN latch across C5, gated
//  through V6 by Z (R18/R19 6.19k off Vref).  V7, fed from A7 through R21
//  3.3k, holds Z near 0 V while the ramp is high; near 0.6 V it lets go, Z
//  rises and the latch fires.  The latch dumps C5 to ≈1.6 V in ≈0.35 µs,
//  then A7 slews back up (2 V/µs) and V7 shuts the gate again.
//
//  From the SPICE sweep (spice/vco/sweep.json), the cap swing per cycle,
//  including the dump time and A7's lag at the trigger, is
//      ΔV(I) = 7.948 + 35.51·I^0.73  V      (fit within 0.15 cents, 1 µA–1.3 mA)
//  so the period is C·ΔV(I)/I.  This is the high-note flattening of the core:
//  −2.5 cents at 440 Hz … −13 at 3.5 kHz … −35 at 14 kHz (vs 22 Hz).
//
//  Shapers (sheet 5):
//    saw   A7 out → C8 30 µF / R29 6.8k (AC coupling, 0.2 s)          = S
//    tri   A8 precision rectifier, V3/V4 КД521Б, R28 = R31 = 100k,
//          R27 100k:  out = −(|S| − Vf), flat near S = 0;  C9 50 µF out
//    pulse A10 comparator, S into (−) via R33 20k, (+) to R34 20k / panel
//
//  PULSE WIDTH (an addition, not on the original panel): a 100k linear pot
//  from 0 V to −12.5 V, wiper through 56k onto A10 (+), the same line the
//  panel's pulse switch drives (X2 pin 10).  With R34 20k to ground,
//      V+ = −12.5·a · 20k / (20k + 56k + 100k·a(1−a))      (a = knob 0…1)
//  so 0 gives V+ = 0 (the original square) and 1 gives −3.29 V, which trips
//  A10 near the bottom of the ramp.  The pot and resistor values are chosen,
//  not from the Polivoks.  Checked in ngspice (spice/vco/pw.cir): 50 → 8 %
//  duty at 450 Hz, 47 → 5 % at 3.6 kHz, pitch unchanged; this model is
//  within 1 % of those (spice/vco/pw_compare.txt).
//  The original switch's fourth position (a fixed narrow pulse, ≈13 %) is
//  removed: a departure from the original panel.  Its sound is the square
//  with PULSE W. at 0.93, which is what old presets that used it load as.
// ============================================================================
class VCO {
  constructor(h, seed) {
    this.h = h;
    this.C = 5.6e-9;                 // C5 5600 pF
    this.Vref = 12.5 * 10 / 12.21;   // A6 output, R15 2.21k / R16 10k
    this.vcLow = 1.57;               // C5 voltage left after the dump (SPICE)
    this.tDump = 0.35e-6;            // latch dump time (SPICE)
    this.tauD = 0.08e-6;             // dump time constant (SPICE)
    this.SR7 = 2e6;                  // A7 КР140УД8Б slew 2 V/µs   EST
    this.SR10 = 3e6;                 // A10 slew                   EST
    this.GBW2pi = 2 * Math.PI * 1e6; // A10 gain-bandwidth 1 MHz    EST
    this.Vsat = 11;                  // op-amp swing on ±12.5 V
    this.Vf = 0.6; this.wf = 0.04;   // КД521Б drop and knee in A8  EST
    this.tC8 = 30e-6 * 6.8e3;        // C8·R29
    this.tC9 = 5;                    // C9 50 µF into the mixer pot (≈100k)
    // Output stages as they meet the mixer pots (open-circuit volts and the
    // resistance behind them): saw = S through R24 20k (≈ ±4 V); triangle =
    // A8 through C9, 0 Ω (≈ 3.4 V p-p); pulse = A10 ±11 V through R35 30k with
    // R36 20k to ground: 0.4·V behind 12k.  R35 is barely legible and R36
    // unreadable on the scan: EST.
    this.Rout = [0, 20e3, 12e3, 12e3];
    this.vpw = 0;                    // A10 (+) volts from the added PULSE WIDTH pot (vpwOf)
    this.vc = 0; this.ce = 0; this.dumping = false; this.rem = 0; this.dA = 0;
    this.o = this.Vref - 5; this.dc = this.Vref - 5; this.tdc = -1.4;
    this.pulse = -this.Vsat; this.n10 = -12; this.vplus = 0; this.S0 = 0;
    const rng = new Rng(seed);
    this.mismatch = (rng.u() - 0.5) * 0.004;    // pair ΔVbe mismatch in octaves
    // Factory trim: reference current that gives A4 = 440 Hz on this core.
    let I = 2e-5; for (let i = 0; i < 20; i++) I = this.C * this.dV(I) * 440;
    // Expo transistor series resistance seen from the emitter: its bulk RE
    // plus the base-side resistance over β.  The base (A4 pin 11) is fed from
    // R4 1k / R5 100 Ω, i.e. 90.9 Ω.  RE 1 Ω, rbb' 100 Ω, β 150 for the
    // КР198НТ1А are EST (no datasheet values to hand).
    const rb = 1 + (100 + 1e3 * 100 / 1100) / 150;
    this.expo = new ExpoPair(I, rb, 303);
    this.saw = 0; this.tri = 0; this.sq = 0;
  }
  dV(I) { return 7.948 + 35.51 * Math.pow(I, 0.73); }
  step(I) {
    const C = this.C, h = this.h, Vref = this.Vref, lo = this.vcLow, tau = this.tauD;
    const dv = this.dV(I), hi = lo + dv - I * this.tDump / C;
    // A10 (+): the added PULSE WIDTH pot's volts (0 V = the original square)
    this.vplus = this.vpw;
    // A7 can't follow the reset: it climbs back at SR7 until it meets X again
    // (≈4 µs).  ce is that climb in cap-voltage terms; while it runs, A7's
    // output (the saw, and what A10 sees through C8) is Vref − ce, not X.
    // acc integrates A7's output.
    const SR = this.SR7;
    let t = h, acc = 0, vc = this.vc, ce = this.ce, guard = 0;
    const climbSpan = (dt) => {             // A7 climbing for dt: ce − SR·t
      acc += ce * dt - 0.5 * SR * dt * dt; ce -= SR * dt;
    };
    while (t > 1e-14 && guard++ < 24) {
      if (this.dumping) {
        // vc = lo + A·(e^(−τd/τ) − E): exponential that lands on lo exactly
        // at the end of the dump.  It falls at ~90 V/µs, so A7 is climbing
        // throughout.
        const E = Math.exp(-this.tDump / tau), A = this.dA;
        const t1 = this.tDump - this.rem, dt = Math.min(t, this.rem), t2 = t1 + dt;
        vc = lo + A * (Math.exp(-t2 / tau) - E);
        climbSpan(dt);
        if (ce < vc) ce = vc;
        this.rem -= dt; t -= dt;
        if (this.rem <= 1e-14) { this.dumping = false; vc = lo; }
      } else {
        const s = I / C, tc = (hi - vc) / s;
        let dt = tc >= t ? t : Math.max(tc, 0);
        if (ce > vc) {                       // still climbing: meets X after tm
          const tm = (ce - vc) / (s + SR);
          if (tm < dt) dt = tm;
          climbSpan(dt); vc += s * dt; t -= dt;
          if (dt === tm) ce = vc;
        } else {
          acc += vc * dt + 0.5 * s * dt * dt; vc += s * dt; ce = vc; t -= dt;
        }
        if (tc <= dt && !this.dumping && vc >= hi - 1e-12) { this.dumping = true; this.rem = this.tDump; this.dA = (vc - lo) / (1 - Math.exp(-this.tDump / tau)); }
      }
    }
    this.vc = vc; this.ce = ce;
    this.o = Vref - acc / h;                    // A7 output, box-filtered over the step
    // C8 / R29 coupling
    this.dc += (this.o - this.dc) * (h / this.tC8);
    const S = this.o - this.dc;
    this.saw = S;
    // A8 precision rectifier: −(|S| − Vf) with a soft knee, then C9
    const a = S < 0 ? -S : S, u = (a - this.Vf) / this.wf;
    const y = -this.wf * (u > 30 ? u : Math.log1p(Math.exp(u)));
    this.tdc += (y - this.tdc) * (h / this.tC9);
    this.tri = y - this.tdc;
    // A10 comparator: КР140УД8Б open loop, S on (−) and V+ on (+).  Its
    // integrator moves at 2π·GBW·Vd, at most SR10 (the ud8.lib model), and
    // clamps at the rails; the output is that node limited to ±Vsat.  The
    // finite gain-bandwidth delays the edge where the slow ramp crosses V+
    // (the reset edge is fast), so the pulse narrows a little at high notes
    // and very narrow ones lose height, as in ngspice.
    // Four sub-steps with S interpolated across the step; the output is
    // averaged over them (box filter) before the mixer sees it.
    const k = this.SR10 / this.GBW2pi, hs = h / 4, S0 = this.S0;
    let n = this.n10, pa = 0;
    for (let i = 1; i <= 4; i++) {
      const vd = this.vplus - (S0 + (S - S0) * (i - 0.5) / 4);
      const n0 = n; n = clamp(n + hs * this.SR10 * Math.tanh(vd / k), -12, 12);
      pa += clamp(0.5 * (n0 + n), -this.Vsat, this.Vsat);
    }
    this.n10 = n; this.S0 = S;
    this.pulse = pa / 4;
    this.sq = this.pulse * 0.4;
  }
  out(wave) { return wave === 0 ? this.tri : wave === 1 ? this.saw : this.sq; }
}

// ============================================================================
//  VCF (sheet 7, У4): two К140УД12 (uA776) programmable op-amps used open-loop.
//  Each is an OTA charging its own internal compensation capacitor C1:
//     dV/dt = (Iset/C1) · tanh( Vdiff / 4VT )
//  (CC–CB input stage Q1–Q4 of the uA776 → 4 junctions → 4VT; tail current
//  = Iset through the Q14/Q15/Q19 loop).  Checked against a transistor-level
//  ngspice model of the SGS-Thomson UA776 schematic (spice/, see README there).
//
//  A2 (inverting input) sums, through a resistor network:
//     mixer  → R85 39k,   LP (A3 out) → R3 47k,   R4 1k to ground,
//     BP (A2 out) → R89 100k pot → wiper → R54 47k   ("Резонанс", sheet 11).
//  Knob up moves the wiper to the ground end, removing the damping.
//  A3 (non-inverting) gets BP through R6 47k / R7 1k.
//  State: y1 = −V(A2) = BP, y2 = −V(A3) = LP (both circuit outputs invert).
//  Solved implicitly (trapezoidal + Newton).
// ============================================================================
class K140VCF {
  constructor(h) {
    this.h = h; this.a3 = 1 / 48;          // R7/(R6+R7)
    this.C1 = 25e-12;          // uA776 C1: fits datasheet SR 0.8 V/µs @15 µA and GBW 0.1 MHz @1.5 µA  EST
    this.vos1 = 0.0021; this.vos2 = -0.0014;   // input offset voltages (datasheet typ 2 mV)
    this.Vs = 11.5;            // output swing on ±12.5 V (datasheet: ±13–14 V on ±15 V)
    // slew asymmetry of the uA776: in the transistor model the output falls
    // ~20 % faster than it rises (0.045 vs 0.037 V/µs at Iset 1 µA).  This
    // rectifies hard-driven signals and shifts LP's DC level.  From SPICE, EST
    this.dsl = 0.1;
    this.y1 = 0; this.y2 = 0;
    this.wIn = 0; this.wL = 0; this.wD = 0;
    this.setRes(0);
  }
  // Resonance network weights at A2's inverting input (exact node equation).
  //   res 0..1 → wiper fraction p = 1 − res (linear taper EST)
  //   excess: negative damping from the op-amps' excess phase, as a fraction
  //   of wL.  SPICE puts the real loop right at the edge at full travel; this
  //   small value lets the last ~0.5 % of the knob self-oscillate.          EST
  setRes(res) {
    const p = 1 - res, Rth = 100e3 * p * (1 - p);
    const gIn = 1 / 39e3, gL = 1 / 47e3, gD = 1 / (47e3 + Rth), G = 1 / 1e3 + gIn + gL + gD;
    this.wIn = gIn / G; this.wL = gL / G;
    this.wD = p * gD / G - 0.005 * this.wL;
  }
  step(vin, I, VT) {
    const h = this.h, c = 1 / (4 * VT), g = I / this.C1, d = this.dsl;
    const wIn = this.wIn, wL = this.wL, wD = this.wD, a3 = this.a3;
    // θ-method: trapezoidal (θ = ½) while the small-signal ω0·h < 1, sliding to
    // backward Euler above, so the >20 kHz range V1 can reach (to ~130 kHz)
    // is damped instead of ringing at Nyquist.
    const x = g * c * Math.sqrt(wL * a3) * h, th = x < 1 ? 0.5 : x > 3 ? 1 : 0.25 + 0.25 * x;
    const h2 = h * th, h1 = h - h2;
    const y1 = this.y1, y2 = this.y2, o1 = this.vos1, o2 = this.vos2, u = wIn * vin + o1;
    // OTA current: Iset·tanh(x), scaled 1±d for the two slew directions
    let t = Math.tanh((u - wL * y2 - wD * y1) * c);
    const F1n = g * t * (1 + d * t);
    t = Math.tanh((a3 * y1 + o2) * c);
    const F2n = g * t * (1 + d * t);
    // Newton from the previous state; steps limited so the saturating tanh
    // can't throw it into a limit cycle when g·h is large
    let z1 = y1, z2 = y2;
    for (let it = 0; it < 4; it++) {
      const t1 = Math.tanh((u - wL * z2 - wD * z1) * c);
      const t2 = Math.tanh((a3 * z1 + o2) * c);
      const r1 = z1 - y1 - h1 * F1n - h2 * g * t1 * (1 + d * t1);
      const r2 = z2 - y2 - h1 * F2n - h2 * g * t2 * (1 + d * t2);
      const s1 = g * (1 - t1 * t1) * (1 + 2 * d * t1) * c, s2 = g * (1 - t2 * t2) * (1 + 2 * d * t2) * c * a3;
      const j11 = 1 + h2 * s1 * wD, j12 = h2 * s1 * wL, j21 = -h2 * s2;
      const det = j11 - j12 * j21;
      const d1 = (r1 - j12 * r2) / det, d2 = (j11 * r2 - j21 * r1) / det;
      z1 -= d1 > 2 ? 2 : d1 < -2 ? -2 : d1;
      z2 -= d2 > 2 ? 2 : d2 < -2 ? -2 : d2;
    }
    const Vs = this.Vs;
    this.y1 = z1 > Vs ? Vs : z1 < -Vs ? -Vs : z1;
    this.y2 = z2 > Vs ? Vs : z2 < -Vs ? -Vs : z2;
    if (!(this.y1 === this.y1) || !(this.y2 === this.y2)) { this.y1 = 0; this.y2 = 0; }
  }
}

// ============================================================================
//  VCF control converter (sheet 7: A1 КР140УД8Б, V1 КТ315Г, R2 3k; panel
//  network sheet 11).  A1 holds V1's base (the summing node) at 0 V and drives
//  the emitter; R2 sits across base–emitter, so
//      Vbe = R2·(Iin − Ic/β),   Ic = Is·exp(Vbe/VT)
//  i.e. the cutoff is exponential in the summed input current
//  (VT·ln2/R2 ≈ 6 µA per octave, uncompensated for temperature).
//  Iin = 12.5 V/R1 100k + cutoff pot R90 → R87 47k + envelope pot R96 →
//        R88 100k + modulation pot R91 → R86 100k.
//  V1's collector feeds both Iset pins through R5/R8 110k; V1 saturates at
//  about 224 µA total (2 × 11.8 V / 110k), which is the top of the range.
// ============================================================================
class FilterCV {
  constructor() { this.Is = 2e-14; this.beta = 150; this.R2 = 3e3; this.x = 0.4; }   // КТ315Г Is, β  EST
  // pot wiper source: fraction t of Vsrc with Thevenin 100k·t(1−t), into Rs
  static wiper(t, V, Rs) { return t * V / (Rs + 100e3 * t * (1 - t)); }
  // returns Iset per op-amp
  iset(Iin, T) {
    const VT = VT_OF(T), R2 = this.R2, k = R2 * this.Is / this.beta;
    let v = this.x;
    for (let i = 0; i < 6; i++) {
      const e = Math.exp(Math.min(v / VT, 60));
      v -= (v - R2 * Iin + k * e) / (1 + k * e / VT);
    }
    this.x = v;
    const Ic = this.Is * Math.exp(Math.min(v / VT, 60)), Imax = 224e-6;
    return 0.5 * Ic / Math.pow(1 + Math.pow(Ic / Imax, 4), 0.25) + 1e-11;
  }
}

// ============================================================================
//  Envelope generator (on the VCF board, sheet 7 — same design used for the
//  VCA): a 5 µF capacitor charged/discharged through the pots and КД521
//  diodes; comparator A5 ends the attack at +6 V.  The diode is solved with
//  the Shockley equation, which gives the real curve shapes and tails.
// ============================================================================
class EG {
  constructor(h) {
    this.h = h; this.C = 5e-6; this.Vpk = 6; this.Vsup = 12.5;
    this.v = 0; this.stage = 0; this.Iw = [1e-6, 1e-6, 1e-6];
    this.nVT = 1.9 * VT_OF(300); this.Is = 2e-9; this.Rbleed = 10e6;
  }
  diodeI(vd, R, w) {
    if (vd <= 0) return 0;
    let I = this.Iw[w]; if (!(I > 0)) I = vd / R;
    for (let i = 0; i < 4; i++) {
      const f = I * R + this.nVT * Math.log(1 + I / this.Is) - vd;
      I -= f / (R + this.nVT / (this.Is + I));
      if (I < 1e-15) I = 1e-15;
    }
    this.Iw[w] = I; return I;
  }
  trigger() { this.stage = 1; }
  step(gate, Ra, Rd, sus, Rr, cycle) {
    const C = this.C, h = this.h, Vs = sus * this.Vpk;
    let v = this.v;
    if (gate && this.stage === 0) this.stage = 1;
    if (!gate) this.stage = 0;
    if (this.stage === 1) {
      v += this.diodeI(this.Vsup - v, Ra, 0) * h / C;
      if (v >= this.Vpk) { v = this.Vpk; this.stage = 2; }
    } else if (this.stage === 2) {
      if (v > Vs) v -= this.diodeI(v - Vs, Rd, 1) * h / C;
      if (cycle && v - Vs < 0.03 * this.Vpk) this.stage = 1;
    } else {
      v -= this.diodeI(v, Rr, 2) * h / C;
    }
    v -= v * h / (this.Rbleed * C);
    this.v = v < 0 ? 0 : v;
    return this.v / this.Vpk;
  }
}

// ============================================================================
//  Mixer (sheet 9, У6; panel pots on sheet 1).  Each source drives a 100k
//  panel pot (R104 Генер. I, R103 Генер. II, R105 Шум, R106 Внеш.) wired as a
//  divider; the wiper feeds A2's virtual earth through 22k (R7, R17, R8, R9)
//  and R10 22k closes the loop, so each channel is
//      out = −V·W,   W = 1 / (1 + (Ra + Rs)·(1/Rb + 1/22k))
//  with Ra = 100k(1−t), Rb = 100k·t and Rs the source's own resistance
//  (saw R24 20k, triangle 0, pulse R35 30k ∥ R36 20k EST).  Checked against
//  ngspice in spice/mixer/.  A2's output goes through C2 0.22 µF and R85 39k
//  into the filter (≈1 k to ground there): an 18 Hz high-pass.
//  Pot taper: linear (group А) EST.
// ============================================================================
// DRIVE (added, not on the original panel): a 150k log pot in series with
// A2's feedback resistor R10 22k.  The mixer's gain rises with the feedback
// resistance, (22k + Rd) / 22k, up to about ×7.8, so A2 runs into its rails
// (±11 V, rail() above) and the filter's input pair is driven harder: the
// overdrive comes from the circuit's own stages.  At 0 it is the original.
function driveGain(t) { return 1 + potA(t, 0, 150e3) / 22e3; }
function mixGain(t, Rs) {
  const Ra = 100e3 * (1 - t) + 1, Rb = 100e3 * t + 1, G = 1 / Rb + 1 / 22e3;
  return 1 / (1 + (Ra + Rs) * G);
}

// ============================================================================
//  VCA (sheet 8, У5): two К118УД1Б differential pairs, each followed by a
//  КР140УД8Б that turns the collector currents into a voltage,
//      Vout = 200k · α·Itail · tanh(Vd / 2VT)        (R9 / R20 200k)
//  Stage 1 (A1/A2): filter output via C1 10 µF, R2 20k / R4 200 Ω (÷101);
//  its tail is set from the modulation input (X5 pin 4, R6 100k into pin 12)
//  with R7 27k from the current-source emitter to −12.5 V, so it idles at
//  ≈58 µA, shuts off below −0.4 V and reaches ≈400 µA above +1 V.
//  Stage 2 (A3/A4): A2 output via R13 20k / R16 200 Ω; tail from the envelope
//  (A6, 0…6 V) through R18 100k into the chip's own mirror (R5 1.7k + diode,
//  R2 1.8k): nothing below ≈0.6 V, then ≈9.3 µA per volt.
//  Output through C3 50 µF.  The tail currents come from the chip's
//  datasheet schematic (R1/R3 4k, R2 1.8k, R4 4k, R5 1.7k), solved below;
//  checked against a transistor-level ngspice model in spice/vca/.
//  Transistor IS 1e-15, β 120 EST; offset residual after the factory trims
//  (R1, R14) EST.
// ============================================================================
class K118Tail {
  // r7: external resistor from pin 2 to −12.5 V (stage 1) or 0 (stage 2)
  constructor(r7) {
    const VT = VT_OF(300.15), Is = 1e-15, bf = 120, ie = (v) => Is * (1 + 1 / bf) * Math.exp(v / VT);
    const N = 400, lo = -1.0, hi = 0.85; this.lo = lo; this.dv = (hi - lo) / (N - 1); this.N = N;
    this.iin = new Float64Array(N); this.it = new Float64Array(N);
    for (let k = 0; k < N; k++) {
      const vb = lo + k * this.dv;
      // diode-connected transistor + R5 1.7k: vd + 1.7k·Id = vb
      let a = -2, b = vb; for (let i = 0; i < 80; i++) { const m = 0.5 * (a + b); if (m + 1.7e3 * ie(m) > vb) b = m; else a = m; }
      const Id = Math.max(0, (vb - 0.5 * (a + b)) / 1.7e3);
      // current source: emitter node ve, Ie = ie(vb − ve) = ve/1.8k + (ve + 12.5)/r7
      a = -13; b = vb;
      for (let i = 0; i < 100; i++) { const m = 0.5 * (a + b), f = ie(vb - m) - m / 1.8e3 - (r7 ? (m + 12.5) / r7 : 0); if (f > 0) a = m; else b = m; }
      const Ie = ie(vb - 0.5 * (a + b));
      this.iin[k] = Id + Ie / (bf + 1); this.it[k] = Ie * bf / (bf + 1);
    }
  }
  // tail current for a source V behind resistance R driving pin 12
  tail(V, R) {
    let a = 0, b = this.N - 1;
    const g = (k) => this.lo + k * this.dv + R * this.iin[k] - V;
    if (g(a) >= 0) return 0;
    if (g(b) <= 0) return this.it[b];
    while (b - a > 1) { const m = (a + b) >> 1; if (g(m) > 0) b = m; else a = m; }
    const ga = g(a), gb = g(b), f = ga / (ga - gb);
    return this.it[a] + f * (this.it[b] - this.it[a]);
  }
}
class VCA {
  constructor(h) {
    this.h = h; this.VT = VT_OF(300.15);
    this.s1 = new K118Tail(27e3); this.s2 = new K118Tail(0);
    this.I1 = 58e-6; this.I2 = 0;
    this.k1 = h / (10e-6 * 20.2e3);       // C1 into R2 + R4
    this.k3 = h / (50e-6 * 10e3);         // C3 into the volume pot (R112 10k)
    this.vos1 = 0.1e-3; this.vos2 = 0.2e-3;   // residual offsets after trim  EST
    this.c1 = 0; this.c3 = 0; this.out = 0;
  }
  // vmod: Thevenin voltage and resistance at X5 pin 4; venv: A6 output
  control(vmod, rmod, venv) {
    this.I1 = this.s1.tail(vmod, 100e3 + rmod);
    this.I2 = this.s2.tail(venv, 100e3);
  }
  step(vin) {
    const c = 1 / (2 * this.VT), a = 0.9917;  // α = β/(β+1)
    this.c1 += (vin - this.c1) * this.k1;
    const d1 = (vin - this.c1) / 101 + this.vos1;
    const v2 = rail(200e3 * a * this.I1 * Math.tanh(d1 * c), 11);
    const d2 = v2 / 101 + this.vos2;
    const v4 = rail(200e3 * a * this.I2 * Math.tanh(d2 * c), 11);
    this.c3 += (v4 - this.c3) * this.k3;
    this.v2 = v2; this.v4 = v4;
    return (this.out = v4 - this.c3);
  }
}

// ============================================================================
//  Modulator (sheet 10, У7; "Частота" R107 and "Режим" S58 on sheet 1).
//  A5 is a Schmitt trigger (R13 100k / R14 15k: thresholds ±Vsat·15/115) that
//  charges C7 10 µF through R21 4.3k + R107 100k (rheostat), so the
//  "triangle" is an RC ramp between ±1.43 V (A6 buffers it, X7 pin 6) and
//      f = 1 / (2RC·ln((Vsat + Vth)/(Vsat − Vth)))  ≈ 1.9 … 46 Hz.
//  Square (X7 pin 7): V6 + R16 100k / R17 15k + A7, i.e. 0 / +1.36 V.
//  Noise: V1 КТ315Б junction → A1 (×3.5) → A2 (×100), ≈±1.5 V wideband to
//  the mixer (X7 pin 1).  The same noise through C4/R7/C5/R8 and A3 (×57)
//  is the control noise (X7 pin 2), a band around 160 Hz.  A3's output is
//  sampled onto C6 0.22 µF by the КП303В switch V3 for 0.2 ms after each
//  falling edge of A5 (V4 pulse shaper), A4 buffers it (X7 pin 3).
//  SLOW range (an addition, not on the original panel): a panel switch puts
//  C7a 150 µF in parallel with C7 (160 µF in all) and swaps R107 for a 1 MΩ
//  log gang of the same knob, so R21 4.3k … 1.0043 MΩ gives ≈2.8 Hz down to
//  ≈0.012 Hz (84 s a cycle).  The switch keeps C7's voltage (C7a's charge
//  sharing is ignored, EST).
//  Checked against ngspice in spice/lfo/.  Pot taper (log) EST, noise level
//  EST (0.25 V rms at A2: the sheet draws ±1.5 V at both A2 and A3, which the ×20 band gain between them cannot both meet), V3 on-resistance 300 Ω EST, the sampling edge EST.
// ============================================================================
class Modulator {
  constructor(h, rng) {
    this.h = h; this.rng = rng; this.C = 10e-6; this.Vsat = 10.95; this.vth = 15 / 115;
    this.vc = 0; this.vo = this.Vsat;
    this.n1 = 0; this.n2 = 0; this.ctl = 0; this.sh = 0; this.pulse = 0;
    this.wide = 0;
  }
  // noise: the wideband noise (V at A2's output) averaged over this sample
  step(R, mode, noise) {
    const h = this.h, vo = this.vo;
    this.vc += (vo - this.vc) * (1 - Math.exp(-h / (R * this.C)));
    const th = vo * this.vth;
    if ((vo > 0 && this.vc >= th) || (vo < 0 && this.vc <= th)) {
      this.vo = -vo;
      if (vo > 0) this.pulse = 0.2e-3;          // falling edge of A5 → sample
    }
    // C4 / R7 / C5 / R8 ladder (backward Euler), then A3 ×57
    const C4 = 0.01e-6, C5 = 0.01e-6, R7 = 82e3, R8 = 100e3;
    // states: n1 = voltage across C4, n2 = voltage across C5 (= A3 input)
    const a = h / C4, b = h / C5;
    // i7 = (noise − n1 − n2)/R7 ; n1' = i7/C4 ; n2' = (i7 − n2/R8)/C5
    const m11 = 1 + a / R7, m12 = a / R7, m21 = b / R7, m22 = 1 + b / R7 + b / R8;
    const r1 = this.n1 + a * noise / R7, r2 = this.n2 + b * noise / R7;
    const det = m11 * m22 - m12 * m21;
    this.n1 = (r1 * m22 - m12 * r2) / det; this.n2 = (m11 * r2 - m21 * r1) / det;
    this.ctl = rail(57 * this.n2, 11);
    if (this.pulse > 0) { this.sh += (this.ctl - this.sh) * (1 - Math.exp(-Math.min(h, this.pulse) / (300 * 0.22e-6))); this.pulse -= h; }
    switch (mode) {
      case 0: return this.vc;                                          // triangle, A6
      case 1: return this.vo > 0 ? (this.vo - 0.53) * 15 / 115 : 0;    // square, A7 (V6 КД521 ≈0.53 V)
      case 2: return this.sh;                                          // random steps, A4
      default: return this.ctl;                                        // noise, A3
    }
  }
}

// ============================================================================
//  Keyboard (sheet 3, У1, with the key string and panel from sheet 1).
//  The 48 keys tap a string of R1…R47 100 Ω.  R5 10k (0.5 %) from +12.5 V
//  feeds 1.25 mA into the top of the string, which A2 holds at 0 V by
//  sinking the current at the bottom, so key k sits at −0.125·k V
//  (1.5 V/octave, the same scale as the "Регистры" ladder and the 100k CV
//  inputs).  All key contacts share one bus.  Two keys short the string
//  between them, so the bus reads the lower key (voice 1) and the bottom of
//  the string rises by 0.125 V per shorted step; A4 (all 22.1k, C11 0.01 µF)
//  outputs voice 1 − (bottom − its single-key value), i.e. the upper key
//  (voice 2).  A3/R6 trims that offset.
//  Key detect: A1 runs a ≈16…23 kHz pilot (R3 100k / C1 1000 pF, R4/R2
//  hysteresis) into the string through R1 100k; a pressed key puts it on the
//  bus, A6 (×36 through C5) and V1/V2/R20/C10 rectify it and A8 flips
//  ("Имп. запуск": −12 V pressed).  SPICE: gate on within 8…31 µs, off 262 µs
//  after the last key lifts.
//  Track-and-hold: bus → R21 1k → C9 0.22 µF → V6 КП303В (gate bootstrapped by
//  R29 to A7 while a key is down, pulled to −12 V by V7/V3 when not) → C12
//  0.22 µF → A7.  It settles in ≈0.4 ms half-way, 2.3 ms to 1 % (SPICE).
//  With no key down both outputs hold, and since the bottom of the string is
//  back at its single-key value, voice 2 falls to voice 1.
//  Panel: VCO I is always fed through the glide RC (R24 1k + "Глиссандо"
//  R48 1 MΩ rheostat, C4 0.22 µF, A5); S49 gives VCO II voice 1 ("1-ГОЛ.")
//  or voice 2 ("2-ГОЛ."), both without glide.
//  EST: the A2 input wiring (the scan draws it as positive feedback; the
//  stable reading is used, checked in spice/kybd/), КП303В on-resistance
//  333 Ω, key contact resistance, R48 taper (log).
//  Voltages here are string volts; a MIDI note n is key n − 53 (F).
// ============================================================================
class Keyboard {
  constructor(h) {
    this.h = h; this.held = [];
    this.v9 = 0; this.v12 = 0; this.d2 = 0; this.c4 = 0;
    this.gate = false; this.offT = 0;
    this.lo = 0; this.hi = 0;
  }
  static volts(n) { return -0.125 * (n - 53); }
  press(n) { const i = this.held.indexOf(n); if (i >= 0) this.held.splice(i, 1); this.held.push(n); }
  release(n) { const i = this.held.indexOf(n); if (i >= 0) this.held.splice(i, 1); }
  // rGlide: R48 setting in ohms; returns nothing, read cv1 / cv2 / gate
  step(rGlide, twoVoice) {
    const H = this.held, h = this.h, keys = H.length > 0;
    if (keys) {
      let lo = 1e9, hi = -1e9; for (const n of H) { if (n < lo) lo = n; if (n > hi) hi = n; }
      this.lo = lo; this.hi = hi; this.gate = true; this.offT = 262e-6;
    } else if (this.gate) { this.offT -= h; if (this.offT <= 0) this.gate = false; }
    // C9 / V6 / C12, backward Euler in 4 substeps
    const C = 0.22e-6, g1 = keys ? 1 / 1e3 : 0, gJ = this.gate ? 1 / 333 : 0, vb = Keyboard.volts(this.lo);
    const hs = h / 4, k = C / hs;
    for (let i = 0; i < 4; i++) {
      const a11 = k + g1 + gJ, a22 = k + gJ, b1 = k * this.v9 + g1 * vb, b2 = k * this.v12;
      const det = a11 * a22 - gJ * gJ;
      this.v9 = (b1 * a22 + gJ * b2) / det; this.v12 = (a11 * b2 + gJ * b1) / det;
    }
    // A4: the shorted steps come through R11 with C11 across R13 (221 µs)
    const d = keys ? -0.125 * (this.hi - this.lo) : 0;
    this.d2 += (d - this.d2) * (1 - Math.exp(-h / 221e-6));
    // glide: R24 1k + R48 into C4 0.22 µF, A5 follower
    this.c4 += (this.v12 - this.c4) * (1 - Math.exp(-h / ((1e3 + rGlide) * 0.22e-6)));
    this.cv1 = this.c4;
    this.cv2 = twoVoice ? this.v12 + this.d2 : this.v12;
  }
}

// ============================================================================
//  VCO CV summer (sheet 5, A1/A2) and its panel inputs (sheet 1).
//  A2's inverting input (X2 pins 3/4, "Вход эксп.") sums currents; R2 22.1k
//  turns them into the expo drive.  The keyboard and register inputs are
//  100k at 1.5 V/octave, so 15 µA into the node is one octave and positive
//  current lowers the pitch (32' sits at the positive end of the ladder).
//  Checked in spice/vco/summer.cir (summer.js).
//    "Модуляция" R67 / R80 100k: bus on the top, wiper through R62 / R76 47k
//    "Генератор II" (VCO I): VCO II triangle through R64 100k onto R66 100k,
//        wiper through R63* 100k (* = selected on test, EST)
//    "Расстройка" (VCO II): R79 100k across ±12.5 V, wiper through R77 1.0 MΩ
//  Pot tapers linear EST; which way the detune turns is EST (kept sharp to
//  the right).
// ============================================================================
const I_OCT = 1.5 / 100e3;
// wiper at a (0…1 from the ground end) of a 100k pot with v on top, then rs
function modOct(a, v) { return -(a * v) / (47e3 + 100e3 * a * (1 - a)) / I_OCT; }
function fmOctPerVolt(a) { const rth = a * 100e3 * (200e3 - a * 100e3) / 200e3; return -(a / 2) / (100e3 + rth) / I_OCT; }
// "Pitch" (an addition, not on the original panel): a 100k pot across
// ±12.5 V into each VCO's summing node through 833k, i.e. ±15 µA = ±1 octave.
function pitchOct(d) { const ad = (1 - d) / 2, rth = 100e3 * ad * (1 - ad); return -(-12.5 + 25 * ad) / (12.5 / I_OCT + rth) / I_OCT; }
// "Pulse width" (an addition): A10 (+) volts for the pot at a (see VCO above)
function vpwOf(a) { return -12.5 * a * 20e3 / (76e3 + 100e3 * a * (1 - a)); }

// ============================================================================
//  Engine
// ============================================================================
const OUT_SCALE = 1 / 6;
const PARAM_DEFAULTS = {
  power: 0,
  lfoRate: 0.45, lfoMode: 0, lfoRange: 0,
  phones: 0.6, tune: 0, glide: 0, voice: 1, volume: 0.7, outSel: 0,
  o1range: 2, o1wave: 1, o1mod: 0, o1fm: 0, o1pitch: 0, o1pw: 0,
  o2range: 2, o2wave: 2, o2mod: 0, o2detune: 0.0, o2pitch: 0, o2pw: 0,
  mix1: 0.65, mix2: 0.5, mixN: 0, mixE: 0, drive: 0,
  fA: 0.05, fD: 0.45, fS: 0.3, fR: 0.35, cutoff: 0.59, res: 0.5, fMod: 0, fEnv: 0.45, fMode: 0, fEgMode: 0,
  aA: 0.02, aD: 0.5, aS: 0.7, aR: 0.35, aEgMode: 0, aMod: 0, vcaHold: 0,
};
const SMOOTHED = ['lfoRate','phones','tune','glide','volume','o1mod','o1fm','o2mod','o2detune','o1pitch','o2pitch','o1pw','o2pw','mix1','mix2','mixN','mixE','drive','cutoff','res','fMod','fEnv','aMod','fS','aS'];

class PolivoksEngine {
  constructor(sr) {
    this.sr = sr; this.OS = 4; this.fs = sr * this.OS;
    const hb = 1 / sr, ho = 1 / this.fs; this.hb = hb; this.ho = ho;
    this.rng = new Rng(12345);
    this.vco1 = new VCO(ho, 77); this.vco2 = new VCO(ho, 991);
    this.vco1.vc = 3.1; this.vco2.vc = 7.3;
    this.vcf = new K140VCF(ho);
    this.egF = new EG(hb); this.egA = new EG(hb);
    this.lfo = new Modulator(hb, new Rng(4242)); this.nzAvg = 0; this.lfoV = 0;
    this.vca = new VCA(ho); this.mixHp = 0;
    this.fcv = new FilterCV();
    this.p = Object.assign({}, PARAM_DEFAULTS); this.ps = Object.assign({}, PARAM_DEFAULTS);
    this.Tchip = 303;
    this.kb = new Keyboard(hb); this.kb.lo = this.kb.hi = 57;
    this.kb.v9 = this.kb.v12 = this.kb.c4 = Keyboard.volts(57);
    this.T1 = 303; this.T2 = 303; this.drift1 = 0; this.drift2 = 0;
    this.noiseLP = 0;
    this.hpX = 0; this.hpY = 0; this.vcaHpX = 0; this.vcaHpY = 0;
    this.ext = null; this.extPos = 0;
    this.lastVal = 0;
    this.powerLevel = 0;
    // decimation FIR (Blackman windowed sinc)
    const N = 48, fc = 0.5 / this.OS * 0.92; this.firN = N;
    this.fir = new Float64Array(N); let sum = 0;
    for (let i = 0; i < N; i++) {
      const m = i - (N - 1) / 2;
      const sinc = m === 0 ? 2 * fc : Math.sin(2 * Math.PI * fc * m) / (Math.PI * m);
      const w = 0.42 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)) + 0.08 * Math.cos(4 * Math.PI * i / (N - 1));
      this.fir[i] = sinc * w; sum += this.fir[i];
    }
    for (let i = 0; i < N; i++) this.fir[i] /= sum;
    this.buf = new Float64Array(N * 2); this.bi = 0;
    this.scope = new Float32Array(512); this.scopeI = 0;
  }

  setParam(id, v) { if (id in this.p) { this.p[id] = v; if (SMOOTHED.indexOf(id) < 0) this.ps[id] = v; } }
  setExt(data) { this.ext = data; this.extPos = 0; }

  // keys go to the keyboard board; the envelopes follow its gate
  noteOn(n) { this.kb.press(n); }
  noteOff(n) { this.kb.release(n); }
  allOff() { this.kb.held.length = 0; }
  get held() { return this.kb.held; }

  render(out, n) {
    const p = this.p, ps = this.ps, OS = this.OS, ho = this.ho, hb = this.hb;
    const vco1 = this.vco1, vco2 = this.vco2, vcf = this.vcf, rng = this.rng, fir = this.fir, N = this.firN;
    const sm = 1 - Math.exp(-hb / 0.012);
    const rangeOct = [-2, -1, 0, 1, 2];
    for (let s = 0; s < n; s++) {
      for (let j = 0; j < SMOOTHED.length; j++) { const k = SMOOTHED[j]; ps[k] += (p[k] - ps[k]) * sm; }
      // power supply ramps like rail capacitors charging
      this.powerLevel += ((p.power ? 1 : 0) - this.powerLevel) * (p.power ? 0.0004 : 0.002);

      // modulator
      //   R21 4.3k + "Частота" R107 100k rheostat; lfo = modulation bus volts
      //   SLOW range (added): R107's 1 MΩ gang and C7 ∥ C7a = 160 µF
      const slow = p.lfoRange >= 0.5;
      this.lfo.C = slow ? 160e-6 : 10e-6;
      const lfoR = 4.3e3 + potA(1 - ps.lfoRate, 0, slow ? 1e6 : 100e3);
      const lfo = this.lfo.step(lfoR, p.lfoMode | 0, this.nzAvg);
      this.lfoV = lfo;                            // last modulator output (V), read by the page for the title wobble

      // keyboard board: gate, track-and-hold, voice 2, glide (sheet 3)
      const kb = this.kb;
      kb.step(potA(ps.glide, 0, 1e6), p.voice >= 0.5);
      this.gate = kb.gate;

      // envelopes
      const ef = this.egF.step(this.gate, potA(p.fA, 200, 1e6), potA(p.fD, 1e3, 2e6), ps.fS, potA(p.fR, 1e3, 2e6), p.fEgMode >= 0.5);
      const ea = this.egA.step(this.gate, potA(p.aA, 200, 1e6), potA(p.aD, 1e3, 2e6), ps.aS, potA(p.aR, 1e3, 2e6), p.aEgMode >= 0.5);

      // slow thermal drift of each expo pair (±0.3 K random walk)
      this.drift1 += (rng.g() * 0.02 - this.drift1 * 1e-4); this.drift2 += (rng.g() * 0.02 - this.drift2 * 1e-4);
      const T1 = this.Tchip + clamp(this.drift1 * 0.01, -0.3, 0.3), T2 = this.Tchip + clamp(this.drift2 * 0.01, -0.3, 0.3);

      // pitch CVs (octaves relative to A4 at 8')
      const tune = ps.tune * 2 / 12;
      //   key CV −1.5 V/oct (key 53 − 69 = −16 semitones at 0 V), summer inputs
      const oct1 = (53 - 69) / 12 - kb.cv1 / 1.5 + rangeOct[p.o1range | 0] + tune + modOct(ps.o1mod, lfo) + pitchOct(ps.o1pitch) + vco1.mismatch;
      const oct2 = (53 - 69) / 12 - kb.cv2 / 1.5 + rangeOct[p.o2range | 0] + tune + modOct(ps.o2mod, lfo) + detuneOct(ps.o2detune) + pitchOct(ps.o2pitch) + vco2.mismatch;
      const I1b = vco1.expo.current(oct1, T1), I2 = vco2.expo.current(oct2, T2);
      vco1.vpw = vpwOf(ps.o1pw); vco2.vpw = vpwOf(ps.o2pw);
      const w1 = Math.min(2, p.o1wave | 0), w2 = Math.min(2, p.o2wave | 0);   // 0 tri, 1 saw, 2 pulse
      const fmk = fmOctPerVolt(ps.o1fm) * LN2;      // nepers per volt of VCO II triangle

      // filter Iset: currents into A1's summing node (sheet 7 + panel, sheet 11)
      //   cutoff pot log taper EST; amount pots linear EST; modulation bus
      //   from sheet 10 (R91 100k pot → R86 100k)
      const tc = (Math.exp(5 * ps.cutoff) - 1) / (Math.exp(5) - 1);
      const vl = lfo;
      const Iin = 12.5 / 100e3 + FilterCV.wiper(tc, 12.5, 47e3)
                + FilterCV.wiper(ps.fEnv, ef * this.egF.Vpk, 100e3) + FilterCV.wiper(ps.fMod, vl, 100e3);
      const Iset = this.fcv.iset(Iin, this.Tchip);
      vcf.setRes(ps.res);
      const VTf = VT_OF(this.Tchip);
      const lp = p.fMode < 0.5;

      // VCA (sheet 8): stage 1 tail from the "Модуляция" pot (R97 100k) on the
      // modulation bus, stage 2 tail from the envelope (A6, 0…6 V; the
      // hold switch keeps it at the top)
      const venv = (p.vcaHold >= 0.5 ? 1 : ea) * this.egA.Vpk;
      this.vca.control(ps.aMod * lfo, 100e3 * ps.aMod * (1 - ps.aMod), venv);
      // mixer (sheet 9): per-channel gain into A2's virtual earth
      const g1 = mixGain(ps.mix1, vco1.Rout[w1]), g2 = mixGain(ps.mix2, vco2.Rout[w2]);
      const gn = mixGain(ps.mixN, 0), ge = mixGain(ps.mixE, 0), dg = driveGain(ps.drive);
      let ext = 0;
      if (this.ext && ge > 0.001) { ext = this.ext[this.extPos]; if (++this.extPos >= this.ext.length) this.extPos = 0; }   // 1 V peak line level EST

      // modulator noise: A2 bandwidth ≈15 kHz (КР140УД8Б GBW / 101), 0.25 V rms EST
      const nk = 1 - Math.exp(-ho * 2 * Math.PI * 15000);
      const kmix = ho / (0.22e-6 * 39.96e3);      // C2 into R85 + filter input
      let nzs = 0;
      for (let o = 0; o < OS; o++) {
        vco2.step(I2);
        const o2 = vco2.out(w2);
        vco1.step(I1b * Math.exp(fmk * vco2.tri));
        const o1 = vco1.out(w1);
        this.noiseLP += (rng.g() * 0.25 * Math.sqrt(1 / (nk * 0.5)) - this.noiseLP) * nk;
        nzs += this.noiseLP;
        const a2 = rail(-(g1 * o1 + g2 * o2 + gn * this.noiseLP + ge * ext) * dg, 11);
        this.mixHp += (a2 - this.mixHp) * kmix;
        vcf.step(a2 - this.mixHp, Iset, VTf);
        const vf = lp ? -vcf.y2 : -vcf.y1;          // both outputs invert
        const vca = this.vca.step(vf);
        const b = this.buf, i0 = this.bi;
        b[i0] = vca; b[i0 + N] = vca; this.bi = (i0 + 1) % N;
      }
      this.nzAvg = nzs / OS;
      // decimate
      let acc = 0; const b = this.buf, start = this.bi;
      for (let i = 0; i < N; i++) acc += fir[i] * b[start + i];
      // VCA output in volts (C3 is inside the VCA model); OUT_SCALE maps the
      // jack voltage to the digital full scale (not a circuit value)
      this.hpY = acc;
      const lvl = p.outSel >= 0.5 ? ps.phones : ps.volume;
      // part of DRIVE's extra level is taken back here (output scaling, not circuit), so it adds grit more than loudness
      let y = this.hpY * OUT_SCALE * lvl * lvl * 1.3 * this.powerLevel / Math.sqrt(dg);
      y = y / Math.sqrt(1 + y * y);
      out[s] = y;
      this.scope[this.scopeI] = this.hpY; this.scopeI = (this.scopeI + 1) & 511;
    }
  }
}

if (typeof module !== 'undefined') module.exports = { PolivoksEngine, driveGain, Keyboard, modOct, fmOctPerVolt, detuneOct, pitchOct, vpwOf, VCO, K140VCF, FilterCV, EG, ExpoPair, VT_OF, VCA, K118Tail, Modulator, mixGain };

<script type="text/plain" id="seq-src">// ============================================================================
// Knob step sequencer: a PERFORMANCE FEATURE added on top of the model.
// It is not part of the Polivoks circuit.  Each knob can have its own step
// sequence; the sequence is a ± offset around where the knob is set, so
// turning the knob moves the centre and the sequence rides on top.  It runs
// at control rate (every CHUNK samples) and only ever calls the engine's
// setParam, exactly as turning the knob would, so the circuit model is
// untouched.  With every sequence off the engine sees the plain knob values.
// ============================================================================
class KnobSeq {
  constructor(sr, engine, report) {
    this.sr = sr; this.e = engine; this.report = report || null;
    this.base = {};      // knob settings as turned on the panel
    this.range = {};     // id -> [lo, hi]
    this.seq = {};       // id -> { on, len, div, depth, slew, steps[16] }
    this.cur = {};       // slewed step value, −1..+1
    this.val = {};       // value last sent to the engine
    this.bpm = 120;
    this.pos = 0;        // clock position in 16th notes
    this.time = 0;
    this.pulses = 0; this.extT = -1;   // MIDI clock, 24 pulses per quarter
    this.clkT = []; this.extBpm = 0;    // tempo measured from the MIDI clock
    this.repT = 0;
  }
  extActive() { return this.extT >= 0 && this.time - this.extT < 0.5; }
  param(id, v) { this.base[id] = v; const s = this.seq[id]; if (!(s && s.on)) this.e.setParam(id, v); }
  setSeq(id, s, range) {
    const was = this.seq[id] && this.seq[id].on;
    this.seq[id] = s; if (range) this.range[id] = range;
    if (s.on && !was) this.cur[id] = 0;
    if (!s.on && was && id in this.base) { this.e.setParam(id, this.base[id]); delete this.val[id]; }
  }
  setBpm(b) { this.bpm = Math.max(20, Math.min(300, b)); }
  // MIDI clock: each pulse is 1/6 of a 16th; Start goes back to step 1
  clock() {
    if (!this.extActive()) { this.pulses = Math.round(this.pos * 6); this.clkT.length = 0; }
    this.pulses++; this.pos = this.pulses / 6; this.extT = this.time;
    const c = this.clkT; c.push(this.time); if (c.length > 49) c.shift();
    if (c.length >= 13) {
      let b = 60 / ((c[c.length - 1] - c[0]) / (c.length - 1) * 24);
      if (Math.abs(b - Math.round(b)) < 0.3) b = Math.round(b);   // DAW tempos are mostly whole
      this.extBpm = Math.max(20, Math.min(300, b));
    }
  }
  start() { this.pulses = 0; this.pos = 0; this.extT = this.time; }
  stop() { this.extT = -1; this.clkT.length = 0; }
  // the clock's tempo: MIDI clock while it runs, else the internal BPM
  tempo() { return this.extActive() && this.extBpm ? this.extBpm : this.bpm; }
  tick(dt) {
    this.time += dt;
    if (!this.extActive()) this.pos += dt * this.bpm / 15;   // 4 sixteenths per beat
    let any = false;
    for (const id in this.seq) {
      const s = this.seq[id]; if (!s.on) continue; any = true;
      const step = Math.floor(this.pos / s.div) % s.len;
      const k = s.slew > 0 ? 1 - Math.exp(-dt / s.slew) : 1;
      const c = this.cur[id] = (this.cur[id] || 0) + (s.steps[step] - (this.cur[id] || 0)) * k;
      const r = this.range[id] || [0, 1], b = id in this.base ? this.base[id] : r[0];
      const v = Math.max(r[0], Math.min(r[1], b + s.depth * c * (r[1] - r[0])));
      if (v !== this.val[id]) { this.val[id] = v; this.e.setParam(id, v); }
    }
    this.repT += dt;
    if (this.report && this.repT >= 1 / 30) { this.repT = 0; this.report({ t: 'seqpos', pos: Math.floor(this.pos), ext: this.extActive(), v: any ? Object.assign({}, this.val) : null }); }
  }
  render(out, n) {
    const C = 64;
    for (let i = 0; i < n; i += C) {
      const m = Math.min(C, n - i);
      this.tick(m / this.sr);
      this.e.render(i === 0 && m === n ? out : out.subarray(i, i + m), m);
    }
  }
  msg(d) {
    if (d.t === 'p') this.param(d.id, d.v);
    else if (d.t === 'seq') this.setSeq(d.id, d.s, d.range);
    else if (d.t === 'bpm') this.setBpm(d.v);
    else if (d.t === 'clk') this.clock();
    else if (d.t === 'cstart') this.start();
    else if (d.t === 'cstop') this.stop();
    else if (d.t === 'on') this.e.noteOn(d.n);
    else if (d.t === 'off') this.e.noteOff(d.n);
    else if (d.t === 'all') this.e.allOff();
    else if (d.t === 'ext') this.e.setExt(d.data);
  }
}

if (typeof module !== 'undefined') module.exports = { KnobSeq };

<script type="text/plain" id="fx-src">// ============================================================================
// Stereo echo: an EFFECT ADDED AFTER THE SYNTH.  It is not part of the
// Polivoks circuit and models no particular unit; it is a tape / BBD style
// ping-pong delay voiced to sit with a gritty mono synth:
//   - two delay lines that feed each other (ping-pong), SPREAD sets how much
//     of the repeat crosses sides: 0 = centred mono echo, 1 = full ping-pong
//   - every pass goes through a band limit (TONE: dark … bright low-pass, plus
//     a fixed low cut) and a soft saturator, so repeats get darker and dirtier
//   - FEEDBACK is capped below unity and the saturator bounds the loop, so it
//     can never run away
//   - gentle wow and flutter (slightly different on each side), and delay-time
//     changes glide like a tape motor, so moving TIME bends the repeats
//   - TIME is free (40 ms … 1.2 s) or, with SYNC, steps through note values of
//     the shared clock (which follows MIDI clock)
// The synth engine is untouched: this runs on its mono output.
// ============================================================================
const ECHO_DEFAULTS = { eTime: 0.5, eFb: 0.35, eTone: 0.45, eMix: 0.25, eSpread: 0.8, eSync: 1 };
// sync note values in 16ths: 1/16, 1/8T, 1/8, 1/8., 1/4, 1/4., 1/2
const ECHO_DIVS = [1, 4 / 3, 2, 3, 4, 6, 8];
const ECHO_FB_MAX = 0.94;

class TapeEcho {
  constructor(sr) {
    this.sr = sr;
    this.size = 1 << Math.ceil(Math.log2(sr * 4 + 8)); this.mask = this.size - 1;
    this.bL = new Float32Array(this.size); this.bR = new Float32Array(this.size); this.w = 0;
    this.p = Object.assign({}, ECHO_DEFAULTS); this.ps = Object.assign({}, ECHO_DEFAULTS);
    this.bpm = 120;
    this.d = this.target();                 // current delay, samples (glides)
    this.lpL = 0; this.lpR = 0; this.lp2L = 0; this.lp2R = 0; this.hpL = 0; this.hpR = 0;
    this.yL = 0; this.yR = 0;
    this.ph = [0, 0.37, 0.11, 0.6];          // wow L, wow R, flutter L, flutter R
    this.rs = 0x2545f491; this.drift = 0; this.driftT = 0;
  }
  set(id, v) { if (id in this.p) { this.p[id] = v; if (id === 'eSync') this.ps[id] = v; } }
  // delay time asked for by the knobs, in samples
  target() {
    const u = Math.max(0, Math.min(1, this.p.eTime));
    let s;
    if (this.p.eSync >= 0.5) s = ECHO_DIVS[Math.min(ECHO_DIVS.length - 1, Math.round(u * (ECHO_DIVS.length - 1)))] * 15 / this.bpm;
    else s = 0.04 * Math.pow(30, u);
    return Math.max(0.01, Math.min(3.6, s)) * this.sr;
  }
  rnd() { let s = this.rs; s ^= s << 13; s ^= s >>> 17; s ^= s << 5; this.rs = s >>> 0; return this.rs / 4294967296 - 0.5; }
  // 4-point Hermite read, d samples behind the write head
  read(b, d) {
    const pos = this.w - d, i = Math.floor(pos), f = pos - i, m = this.mask;
    const y0 = b[(i - 1) & m], y1 = b[i & m], y2 = b[(i + 1) & m], y3 = b[(i + 2) & m];
    const c1 = 0.5 * (y2 - y0), c2 = y0 - 2.5 * y1 + 2 * y2 - 0.5 * y3, c3 = 0.5 * (y3 - y0) + 1.5 * (y1 - y2);
    return ((c3 * f + c2) * f + c1) * f + y1;
  }
  // in: mono synth output (left buffer); writes the stereo result to L and R
  process(L, R, n) {
    const sr = this.sr, p = this.p, ps = this.ps;
    const sm = 1 - Math.exp(-1 / (0.02 * sr));
    const glide = 1 - Math.exp(-1 / (0.12 * sr));        // tape motor settling
    const tgt = this.target();
    const hpk = 1 - Math.exp(-2 * Math.PI * 90 / sr);
    const TW = 2 * Math.PI / sr;
    for (let s = 0; s < n; s++) {
      ps.eFb += (p.eFb - ps.eFb) * sm; ps.eTone += (p.eTone - ps.eTone) * sm;
      ps.eMix += (p.eMix - ps.eMix) * sm; ps.eSpread += (p.eSpread - ps.eSpread) * sm;
      this.d += (tgt - this.d) * glide;
      // wow ~0.5 Hz, flutter ~6.5 Hz, plus a slow random drift
      const ph = this.ph;
      ph[0] += 0.53 * TW; ph[1] += 0.61 * TW; ph[2] += 6.3 * TW; ph[3] += 6.9 * TW;
      if (ph[0] > 6.2832) { ph[0] -= 6.2832; } if (ph[1] > 6.2832) ph[1] -= 6.2832;
      if (ph[2] > 6.2832) ph[2] -= 6.2832; if (ph[3] > 6.2832) ph[3] -= 6.2832;
      if (--this.driftT <= 0) { this.driftT = 64; this.drift += (this.rnd() * 0.6 - this.drift * 0.002); }
      const dr = this.drift * 0.00002 * sr;
      const wL = (0.0009 * Math.sin(ph[0]) + 0.00007 * Math.sin(ph[2])) * sr + dr;
      const wR = (0.0009 * Math.sin(ph[1]) + 0.00007 * Math.sin(ph[3])) * sr - dr;
      const dL = Math.max(4, this.d + wL), dR = Math.max(4, this.d + wR);
      const yL = this.read(this.bL, dL), yR = this.read(this.bR, dR);

      const x = L[s], sp = ps.eSpread, fb = ECHO_FB_MAX * Math.min(1, Math.max(0, ps.eFb));
      // ping-pong routing: the dry signal enters on the left (and on the right
      // too as SPREAD comes down); SPREAD of each repeat crosses sides
      let iL = x + fb * ((1 - sp) * yL + sp * yR);
      let iR = x * (1 - sp) + fb * ((1 - sp) * yR + sp * yL);
      // band limit on every pass: tone low-pass (two poles) and a 90 Hz low cut
      const fc = 650 * Math.pow(2, 4.2 * Math.min(1, Math.max(0, ps.eTone)));
      const lk = 1 - Math.exp(-TW * fc);
      this.lpL += (iL - this.lpL) * lk; this.lp2L += (this.lpL - this.lp2L) * lk;
      this.lpR += (iR - this.lpR) * lk; this.lp2R += (this.lpR - this.lp2R) * lk;
      this.hpL += (this.lp2L - this.hpL) * hpk; this.hpR += (this.lp2R - this.hpR) * hpk;
      iL = this.lp2L - this.hpL; iR = this.lp2R - this.hpR;
      // soft saturation, a little asymmetric like an overdriven tape / BBD stage
      this.bL[this.w] = Math.tanh(iL * 1.25 + 0.04) / 1.25 - 0.032;
      this.bR[this.w] = Math.tanh(iR * 1.25 + 0.04) / 1.25 - 0.032;
      this.w = (this.w + 1) & this.mask;

      // dry stays full up to half MIX, then fades; wet comes up to full by half
      const m = Math.min(1, Math.max(0, ps.eMix)), dg = Math.min(1, 2 - 2 * m), wg = Math.min(1, 2 * m);
      L[s] = x * dg + yL * wg;   // the soft clipper (SoftClip) follows
      R[s] = x * dg + yR * wg;
    }
  }
  static lim(x) { return SoftClip.lim(x); }
}

// The output stage (added, not circuit): a soft clipper after the echo.
// Transparent below 0.7, then a soft knee up to 1, so nothing can hard clip.
// `hit` is how far into the knee the loudest sample went since it was last
// read (0 = never reached it, 1 = driven well past it): the CLIP LED.
class SoftClip {
  constructor() { this.hit = 0; }
  process(L, R, n) {
    let pk = 0;
    for (let i = 0; i < n; i++) {
      const a = L[i] < 0 ? -L[i] : L[i], b = R[i] < 0 ? -R[i] : R[i];
      if (a > pk) pk = a; if (b > pk) pk = b;
      L[i] = SoftClip.lim(L[i]); R[i] = SoftClip.lim(R[i]);
    }
    if (pk > 0.7) this.hit = Math.max(this.hit, Math.min(1, (pk - 0.7) / 0.5));
  }
  read() { const h = this.hit; this.hit = 0; return h; }
  // transparent below 0.7, then a soft knee up to 1
  static lim(x) { const a = x < 0 ? -x : x; if (a <= 0.7) return x; const y = 0.7 + 0.3 * Math.tanh((a - 0.7) / 0.3); return x < 0 ? -y : y; }
}

// Passes knob values to the synth engine or to the echo, so the knob
// sequencer can drive both through the one setParam it knows.
class FxRack {
  constructor(engine, fx) { this.e = engine; this.fx = fx; }
  setParam(id, v) { if (id in this.fx.p) this.fx.set(id, v); else this.e.setParam(id, v); }
  noteOn(n) { this.e.noteOn(n); }
  noteOff(n) { this.e.noteOff(n); }
  allOff() { this.e.allOff(); }
  setExt(d) { this.e.setExt(d); }
  render(out, n) { this.e.render(out, n); }
}

// Output level for the page (not circuit): RMS of both channels over the
// last 0.2 s, kept as twelve 1/60 s slices so it is a true moving window.
class Level {
  constructor(sr) { this.chunk = Math.round(sr / 60); this.slices = new Float64Array(12); this.counts = new Float64Array(12); this.k = 0; this.acc = 0; this.n = 0; this.rms = 0; }
  // returns true each time a slice completes (about 60 times a second)
  add(L, R, n) {
    let a = 0; for (let i = 0; i < n; i++) a += L[i] * L[i] + R[i] * R[i];
    this.acc += a / 2; this.n += n;
    if (this.n < this.chunk) return false;
    this.slices[this.k] = this.acc; this.counts[this.k] = this.n; this.k = (this.k + 1) % 12; this.acc = 0; this.n = 0;
    let s = 0, c = 0; for (let j = 0; j < 12; j++) { s += this.slices[j]; c += this.counts[j]; }
    this.rms = Math.sqrt(s / Math.max(c, 1)); return true;
  }
}

if (typeof module !== 'undefined') module.exports = { TapeEcho, FxRack, Level, SoftClip, ECHO_DEFAULTS, ECHO_DIVS, ECHO_FB_MAX };
</script>
<script type="text/plain" id="tone-src">// ============================================================================
// TONE: a random patch that is meant to be PLAYABLE, for the RANDOM row.
// Not part of the Polivoks circuit; it only picks knob and switch settings.
// Unlike PATCH (every control anywhere) it first picks a kind of sound
// (pluck, bass, lead, keys or pad), then sets each control from a range
// that suits that kind, using the knob laws of dsp.js:
//   - draws lean to the middle of each range (average of three throws) and
//     about one control in seven gets a bolder pick from a wider range
//   - VCO II sits in unison (a few cents of detune), an octave or a fifth,
//     using the exact PITCH knob positions for those intervals
//   - one shared LFO does at most one job, and gently: vibrato of a few
//     cents, a slow filter sway, a light tremolo or a soft random sparkle
//   - the VCA always follows its envelope (never HOLD), sustains and
//     releases stay short enough that nothing drones, resonance stays below
//     the screaming zone and is lowered when the cutoff is low
//   - the echo stays synced, on musical note values, with modest repeats
// Level knobs (VOLUME, PHONES) and the output switch are never touched.
// makeTone(rand) returns { kind, k: { id: value } } for every other control.
// ============================================================================
// PITCH knob positions for exact intervals (inverse of pitchOct in dsp.js)
const TONE_PITCH = { 0: 0, 3: 0.257, 4: 0.34216, 5: 0.42689, 7: 0.59465, 12: 1, '-5': -0.42689, '-7': -0.59465, '-12': -1 };
const TONE_CENT = 0.001025;     // DETUNE knob travel for one cent (detuneOct is linear here)
// LFO RATE knob for a few rates: 0 = 1.8 Hz (slowest), 0.2 = 4.7 Hz, 0.27 ≈ 6.3 Hz
const TONE_KINDS = ['pluck', 'bass', 'lead', 'keys', 'pad'];

function makeTone(rand) {
  const R = rand || Math.random;
  const mid = (a, b) => a + (b - a) * (R() + R() + R()) / 3;
  const bold = () => R() < 0.15;
  // a range that is sometimes widened toward [lo, hi]
  const rng = (a, b, lo, hi) => (bold() ? mid(lo, hi) : mid(a, b));
  const pick = (a) => a[Math.floor(R() * a.length)];
  const wpick = (o) => { let t = 0; for (const k in o) t += o[k]; let r = R() * t; for (const k in o) if ((r -= o[k]) < 0) return k; return Object.keys(o)[0]; };
  const kind = wpick({ pluck: 3, bass: 3, lead: 3, keys: 2, pad: 2 });
  const k = {
    tune: 0, glide: 0, voice: 1, o1mod: 0, o1fm: 0, o1pitch: 0, o2mod: 0, o2detune: 0, o2pitch: 0,
    mixN: 0, mixE: 0, fEgMode: 0, fMode: 0, fMod: 0, aEgMode: 0, aMod: 0, vcaHold: 0, lfoMode: 0, lfoRate: 0.2,
  };

  // ---- oscillators: waves, ranges, interval
  // saw, square, narrow pulse (square + PULSE W. near the old switch's 13 %), triangle
  const wave = () => wpick({ 1: 4, 2: 3, p: 2, 0: 1 });
  const w1 = wave(), w2 = R() < 0.5 ? w1 : wave();
  k.o1wave = w1 === 'p' ? 2 : +w1; k.o1pw = w1 === 'p' ? mid(0.75, 0.93) : 0;
  k.o2wave = w2 === 'p' ? 2 : +w2; k.o2pw = w2 === 'p' ? (w1 === 'p' ? k.o1pw : mid(0.75, 0.93)) : 0;
  k.o1range = kind === 'bass' ? +wpick({ 1: 3, 0: 1 }) : kind === 'lead' ? +wpick({ 2: 3, 3: 1 }) : +wpick({ 2: 3, 1: 1 });
  let iv = wpick({ uni: 6, octUp: 2, octDown: kind === 'bass' ? 0 : 1, fifth: 2, fourth: bold() ? 1 : 0, twelfth: bold() ? 1 : 0 });
  k.o2range = k.o1range;
  if (iv === 'octUp') { if (k.o1range < 4) k.o2range++; else iv = 'uni'; }
  if (iv === 'octDown') { if (k.o1range > 0) k.o2range--; else iv = 'uni'; }
  if (iv === 'fifth') k.o2pitch = TONE_PITCH[7];
  if (iv === 'fourth') k.o2pitch = TONE_PITCH[5];
  if (iv === 'twelfth') { k.o2pitch = TONE_PITCH[7]; if (k.o1range < 4) k.o2range++; }
  // detune in cents: a slow beat in unison, a hair otherwise; sign at random
  const cents = iv === 'uni' ? rng(2, 7, 1, 12) : mid(0, 3);
  k.o2detune = (R() < 0.5 ? -1 : 1) * cents * TONE_CENT;
  // mixer: VCO I leads, VCO II a bit lower when it is on another interval
  k.mix1 = mid(0.5, 0.72);
  k.mix2 = iv === 'uni' ? mid(0.35, 0.55) : mid(0.3, 0.5);         // under VCO I so unison beats stay soft
  if (R() < 0.12) k.mix2 = 0;                                 // now and then one oscillator only
  if (R() < 0.12) k.mixN = mid(0.04, 0.14);                   // a breath of noise
  if (bold() && kind !== 'pad') k.o1fm = mid(0.01, 0.04);     // a little cross-mod grit

  // ---- envelopes (knob → time: ATTACK 0.25 ≈ 40 ms, 0.5 ≈ 250 ms; DECAY 0.3 ≈ 0.25 s, 0.5 ≈ 0.75 s time constant)
  const env = {
    pluck: { aA: [0, 0.04], aD: [0.3, 0.45], aS: [0, 0.2], aR: [0.25, 0.4] },
    bass: { aA: [0, 0.04], aD: [0.3, 0.5], aS: [0.5, 0.85], aR: [0.15, 0.3] },
    lead: { aA: [0, 0.1], aD: [0.35, 0.55], aS: [0.65, 0.95], aR: [0.25, 0.4] },
    keys: { aA: [0.02, 0.15], aD: [0.4, 0.55], aS: [0.35, 0.65], aR: [0.3, 0.42] },
    pad: { aA: [0.4, 0.6], aD: [0.45, 0.6], aS: [0.65, 0.9], aR: [0.36, 0.47] },
  }[kind];
  k.aA = mid(...env.aA); k.aD = mid(...env.aD); k.aS = mid(...env.aS); k.aR = mid(...env.aR);
  // filter envelope: snappier than the VCA for plucks and basses, slower for pads
  k.fA = kind === 'pad' ? mid(0.3, 0.55) : kind === 'keys' ? mid(0.02, 0.2) : mid(0, 0.08);
  k.fD = kind === 'pluck' || kind === 'bass' ? mid(0.25, 0.42) : mid(0.35, 0.55);
  k.fS = kind === 'pad' || kind === 'lead' ? mid(0.3, 0.7) : mid(0.05, 0.4);
  k.fR = Math.min(k.aR + 0.05, mid(0.2, 0.45));

  // ---- filter: low-pass (band-pass swings from silent to shrill); cutoff and envelope amount trade off so the note speaks
  k.fEnv = kind === 'pluck' || kind === 'bass' ? rng(0.35, 0.6, 0.2, 0.75) : rng(0.15, 0.45, 0.05, 0.6);
  const cBase = { pluck: [0.47, 0.6], bass: [0.44, 0.56], lead: [0.56, 0.7], keys: [0.53, 0.66], pad: [0.53, 0.66] }[kind];
  k.cutoff = rng(cBase[0], cBase[1], cBase[0] - 0.04, cBase[1] + 0.15);
  // resonance: moderate, lower when the cutoff is low
  k.res = rng(0.15, 0.55, 0.05, 0.8);
  if (k.cutoff < 0.5) k.res = Math.min(k.res, 0.45);
  if (bold() && (kind === 'pluck' || kind === 'bass')) k.fEgMode = 1;   // repeating filter envelope

  // ---- one gentle modulation job for the shared LFO (or none)
  const job = wpick({ none: 3, vibrato: kind === 'lead' || kind === 'pad' ? 4 : 2, sway: kind === 'pad' || kind === 'keys' ? 3 : 2, tremolo: 1, sparkle: 1 });
  if (job === 'vibrato') {
    k.lfoMode = 0; k.lfoRate = mid(0.17, 0.27);
    k.o1mod = k.o2mod = mid(4, 12) * 0.000428;                  // ≈ cents of vibrato (modOct ≈ 2335 cents per unit at 1.43 V)
  } else if (job === 'sway') {
    k.lfoMode = 0; k.lfoRate = mid(0, 0.08); k.fMod = mid(0.03, 0.09);
  } else if (job === 'tremolo') {
    k.lfoMode = 0; k.lfoRate = mid(0.12, 0.25); k.aMod = mid(0.02, 0.06);
  } else if (job === 'sparkle') {
    k.lfoMode = 2; k.lfoRate = mid(0.1, 0.25); k.fMod = mid(0.02, 0.06);
  }
  if (kind === 'lead' && R() < 0.35) k.glide = mid(0.05, 0.22);

  // ---- echo: synced to the clock on 1/8, dotted 1/8 or 1/4, modest repeats
  k.eSync = 1; k.eTime = +wpick({ 2: 3, 3: 3, 4: 2, 5: 1 }) / 6;
  k.eFb = kind === 'pad' ? mid(0.3, 0.5) : rng(0.15, 0.4, 0.05, 0.55);
  k.eMix = R() < 0.2 ? 0 : kind === 'pad' ? mid(0.18, 0.32) : mid(0.08, 0.25);
  k.eTone = mid(0.3, 0.6); k.eSpread = mid(0.5, 0.9);
  for (const id in k) k[id] = Math.round(k[id] * 1e5) / 1e5;
  return { kind, k };
}

if (typeof module !== 'undefined') module.exports = { makeTone, TONE_PITCH, TONE_CENT, TONE_KINDS };
</script>
<script type="text/plain" id="names-src">// ============================================================================
//  Preset names.  Never typed: each one is built from the word lists below and
//  then about half the time jumbled by splicing syllables (spoonerisms, half
//  swaps, portmanteaus, alien endings), keeping only results a mouth can say.
//  makeName(rnd) with rnd a () => [0,1) function, Math.random by default.
// ============================================================================

const NAME_WORDS = {
  scifi: ['Nebula', 'Quasar', 'Photon', 'Plasma', 'Vortex', 'Ion Drive', 'Cyborg', 'Android', 'Warp Core', 'Hyperdrive',
