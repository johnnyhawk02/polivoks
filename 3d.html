<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FILTH 3D — mock-up</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* A 3D mock-up of the FILTH panel (index.html is the real app).  The same
     19 × 3 cell grid, drawn onto a pink slab with raised knobs, switches and
     plates.  Everything the view shows comes from one parameter object P
     (name -> 0..1), so the same view could sit on a plugin's parameters. */
  html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 50% 40%, #2a2a2a 0%, #0b0b0b 70%); touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas.on { cursor: ns-resize; }
  a#back { position: fixed; right: 12px; bottom: 8px; font: 600 11px "Geist Mono", ui-monospace, monospace; letter-spacing: .1em;
    color: #fc0fc0; text-decoration: none; text-transform: uppercase; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<a id="back" href="./">2D panel</a>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ============================================================ parameters
// The whole UI state: one flat object, parameter name -> 0..1.  The 3D view
// only reads P (to draw) and writes P (when you turn something).  toEngine()
// is the one place that turns 0..1 into what the circuit model wants
// (bipolar knobs −1..+1, selector positions, switch 0/1), the same job a
// plugin's parameter layout would do.
const P = {};
const SPEC = {};                       // id -> control description
const PINK = '#fc0fc0', INK = '#0b0b0b', PAPER = '#ffffff';

const knob = (id, label, scale, def, o = {}) => ({ id, label, kind: 'knob', scale, def, ...o });
const sel = (id, label, opts, def) => ({ id, label, kind: 'sel', opts, def });
const sw = (id, top, bot, def, label = '') => ({ id, kind: 'sw', top, bot, def, label });
const at = (c, col, row) => Object.assign(c, { at: [col, row] });
const gap = { kind: 'gap' }, resp = { kind: 'resp' };
const RANGE = [{ t: "32'" }, { t: "16'" }, { t: "8'" }, { t: "4'" }, { t: "2'" }];

// same boxes and cell order as index.html (grid-area row1/col1/row2/col2)
const BOXES = [
  { title: 'MODULATOR', area: [1, 1, 2, 4], n: 3, items: [knob('lfoRate', 'RATE', 'mm', .45), sw('lfoRange', 'FAST', 'SLOW', 0, 'RANGE'),
    sel('lfoMode', 'MODE', [{ i: 'tri' }, { i: 'sq' }, { i: 'sh' }, { i: 'nz' }], 0)] },
  { title: '', area: [2, 1, 4, 4], n: 3, items: [at(knob('phones', 'PHONES', '06', .6), 1, 2), at(knob('tune', 'TUNE', 'bip', 0), 1, 1),
    at(knob('glide', 'GLIDE', 'mm', 0), 2, 1), at(sw('voice', 'MONO', 'DUO', 1), 3, 1), at(knob('volume', 'VOLUME', '06', .7), 2, 2),
    at(sw('outSel', 'LINE', 'PHONES', 0, 'OUTPUT'), 3, 2)] },
  { title: 'VCO I', area: [1, 4, 2, 10], n: 6, items: [sel('o1range', 'RANGE', RANGE, 2), sel('o1wave', 'WAVE', [{ i: 'tri' }, { i: 'saw' }, { i: 'sq' }], 1),
    knob('o1mod', 'MOD', '06', 0), knob('o1fm', 'FM', '06', 0), knob('o1pitch', 'PITCH', 'bip', 0), knob('o1pw', 'PULSE W.', '06', 0, { added: true })] },
  { title: 'VCO II', area: [2, 4, 3, 10], n: 6, items: [sel('o2range', 'RANGE', RANGE, 2), sel('o2wave', 'WAVE', [{ i: 'tri' }, { i: 'saw' }, { i: 'sq' }], 2),
    knob('o2mod', 'MOD', '06', 0), knob('o2detune', 'DETUNE', 'bip', 0), knob('o2pitch', 'PITCH', 'bip', 0), knob('o2pw', 'PULSE W.', '06', 0, { added: true })] },
  { title: 'MIXER', area: [1, 10, 3, 12], n: 2, m: 2, down: true, items: [knob('mix1', 'VCO I', '06', .65), knob('mix2', 'VCO II', '06', .5),
    knob('mixN', 'NOISE', '06', 0), knob('mixE', 'EXT.', '06', 0)] },
  { title: 'ECHO', area: [3, 4, 4, 12], n: 8, items: [knob('eTime', 'TIME', '06', .5), sw('eSync', 'FREE', 'SYNC', 1), knob('eFb', 'FEEDBACK', '06', .35),
    knob('eTone', 'TONE', '06', .45), knob('eSpread', 'SPREAD', '06', .8), knob('eMix', 'MIX', '06', .25)] },
  { title: 'FILTER', area: [1, 12, 4, 16], n: 4, items: [knob('cutoff', 'CUTOFF', 'mm', .59), knob('res', 'RESONANCE', 'mm', .5), sw('fMode', 'BP', 'LP', 0, 'TYPE'), resp,
    knob('fMod', 'MOD', '06', 0), knob('fEnv', 'ENV AMOUNT', '06', .45), sw('fEgMode', '⋀', '⋀⋀', 0, 'ENVELOPE|MODE'), gap,
    knob('fA', 'ATTACK', 'mm', .05), knob('fD', 'DECAY', 'mm', .45), knob('fS', 'SUSTAIN', '06', .3), knob('fR', 'RELEASE', 'mm', .35)] },
  { title: 'AMPLIFIER', area: [2, 16, 4, 20], n: 4, items: [knob('aMod', 'MOD', '06', 0), sw('vcaHold', 'ENV', 'HOLD', 0), sw('aEgMode', '⋀', '⋀⋀', 0, 'ENVELOPE|MODE'), gap,
    knob('aA', 'ATTACK', 'mm', .02), knob('aD', 'DECAY', 'mm', .5), knob('aS', 'SUSTAIN', '06', .7), knob('aR', 'RELEASE', 'mm', .35)] },
];
const INVERT = { fMode: true };        // fMode: top (BP) is value 1
const toU = (c, v) => c.kind === 'knob' ? (c.scale === 'bip' ? (v + 1) / 2 : v) : c.kind === 'sel' ? v / (c.opts.length - 1) : v;
function toEngine(id, u) {
  const c = SPEC[id];
  if (c.kind === 'knob') return c.scale === 'bip' ? u * 2 - 1 : u;
  if (c.kind === 'sel') return Math.round(u * (c.opts.length - 1));
  return u >= .5 ? 1 : 0;
}
for (const b of BOXES) for (const c of b.items) if (c.id) { SPEC[c.id] = c; P[c.id] = toU(c, c.def); }
// the 2D app's saved panel, if there is one, so both pages start the same
try { const s = JSON.parse(localStorage.getItem('polivoks-model-v1') || 'null'); if (s) for (const id in s) if (SPEC[id]) P[id] = toU(SPEC[id], s[id]); } catch (e) {}
const view = [];                       // view objects to redraw from P
function setP(id, u) { u = Math.max(0, Math.min(1, u)); if (P[id] === u) return; P[id] = u; for (const v of view) if (v.id === id) v.draw(); send({ t: 'p', id, v: toEngine(id, u) }); }

// ============================================================ panel geometry (px, same as index.html)
const CW = 78, RH = 110, G = 8, PAD = 18, KR = 17, CY = 34, TOP = 18;
const colX = (c) => PAD + (c - 1) * (CW + G), rowY = (r) => PAD + (r - 1) * (RH + G);
const UW = PAD * 2 + 19 * CW + 18 * G, UH = PAD * 2 + 3 * RH + 2 * G;
const LR = [18, 18 + 248 + 22], LRH = [248, 80], LH = 18 + 248 + 22 + 80 + 18, GAPY = 12, DEPTH = 26;
const S = 2;                           // texture pixels per panel pixel

const DISPLAY = '"Archivo Black", "Arial Black", sans-serif', MONO = '"Geist Mono", ui-monospace, Menlo, monospace';
function canvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w * S); c.height = Math.ceil(h * S); const x = c.getContext('2d'); x.scale(S, S); return [c, x]; }
function text(x, s, px, py, font, col = INK, align = 'center', ls = 0) {
  x.font = font; x.fillStyle = col; x.textAlign = align; x.textBaseline = 'middle';
  if ('letterSpacing' in x) x.letterSpacing = ls + 'px';
  x.fillText(s, px, py);
}
const IC = { tri: [[2, 10], [8, 2], [14, 10]], saw: [[2, 10], [12, 2], [12, 10]], sq: [[2, 10], [2, 3], [8, 3], [8, 10], [14, 10]],
  sh: [[1, 8], [4, 8], [4, 3], [7, 3], [7, 10], [10, 10], [10, 5], [14, 5]], nz: [[1, 6], [2.5, 3], [4, 9], [5.5, 2], [7, 8], [8.5, 4], [10, 10], [11.5, 3], [13, 7]] };
const ang = (u) => (-135 + 270 * u) * Math.PI / 180;
const selA = (c, i) => { const n = c.opts.length, span = n === 5 ? 140 : 130; return (-span / 2 + span * i / (n - 1)) * Math.PI / 180; };

// --------------------------------------------------- three.js scene
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;    // the light never moves: redo shadows only when something tall moves
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.25;
const camera = new THREE.PerspectiveCamera(26, 1, 50, 20000);
// even white light from the front (no shadows), then two coloured lamps low
// at the sides: each throws its own soft shadow across the panel
scene.add(new THREE.HemisphereLight(0xffffff, 0x220011, 0.45));
const front = new THREE.DirectionalLight(0xffffff, 0.4); front.position.set(0, 300, 2000); scene.add(front);
const side = (color, x) => {
  // a spot aimed at its own half of the panel, so its colour fades out toward the far side
  const l = new THREE.SpotLight(color, 0.35, 0, 0.62, 1, 0);
  l.position.set(x, 160, 700); l.castShadow = true;
  l.shadow.mapSize.set(2048, 2048); l.shadow.bias = -0.0004; l.shadow.normalBias = 0.6; l.shadow.radius = 6;
  l.shadow.camera.near = 200; l.shadow.camera.far = 5000;
  l.target.position.set(Math.sign(x) * 380, -40, 0); scene.add(l, l.target); return l;
};
const lamps = [side(0x3d8bff, -1300), side(0xffa020, 1300)];   // cool blue from the left, amber from the right
// Left lamp = VCO I, right lamp = VCO II.  Brightness follows how loud each
// oscillator is in the output (mixer level × amplifier envelope × volume) and
// rises a little with its pitch; the colour pales toward white as it goes up.
const LAMP = [{ base: new THREE.Color(0x2f7dff), hi: new THREE.Color(0xbfe4ff), i: 0, oct: 0, b: 0.35, t: 0 },
              { base: new THREE.Color(0xff9a10), hi: new THREE.Color(0xfff0b0), i: 0, oct: 0, b: 0.35, t: 0 }];
function driveLamps() {
  LAMP.forEach((L, k) => {
    const t = Math.max(0, Math.min(1, (L.oct + 4) / 7));          // 32' low notes .. 2' high notes
    const want = 0.3 + 5 * L.i * (0.55 + 0.45 * t);
    L.b += (want - L.b) * (want > L.b ? 0.5 : 0.1); L.t += (t - L.t) * 0.2;
    lamps[k].intensity = L.b; lamps[k].color.copy(L.base).lerp(L.hi, L.t * 0.6);
  });
}

// the panels lie back like a desk synth; everything is placed in panel pixels
const rig = new THREE.Group(); rig.rotation.x = 0; scene.add(rig);
const TOTALH = UH + GAPY + LH;
const upper = new THREE.Group(), lower = new THREE.Group();
upper.position.set(-UW / 2, TOTALH / 2, 0); lower.position.set(-UW / 2, TOTALH / 2 - UH - GAPY, 0);
rig.add(upper, lower);
front.target = rig;
// a floor under the panels catches their shadow
const floor = new THREE.Mesh(new THREE.PlaneGeometry(6000, 4000), new THREE.ShadowMaterial({ opacity: 0.45 }));
floor.position.z = -DEPTH - 30; floor.receiveShadow = true; rig.add(floor);

const pos = (px, py, z = 0) => new THREE.Vector3(px, -py, z);   // panel px -> group local
const mat = {
  ink: new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.38, metalness: 0.15 }),
  // knobs: matt black body, only the bevelled top edge is polished and catches the lamps
  knobMatt: new THREE.MeshStandardMaterial({ color: 0x060606, roughness: 0.97, metalness: 0, envMapIntensity: 0.15 }),
  knobRim: new THREE.MeshStandardMaterial({ color: 0xb4b4b4, roughness: 0.33, metalness: 1, envMapIntensity: 0.06 }),
  inkMatte: new THREE.MeshLambertMaterial({ color: 0x050505 }),
  edge: new THREE.MeshStandardMaterial({ color: 0xb30a8c, roughness: 0.6 }),
  lit: new THREE.MeshBasicMaterial({ color: 0xffffff }),        // pointers: unlit white, so they glow
};
function slab(w, h, x) {
  const [cv, ctx] = canvas(w, h);
  ctx.fillStyle = PINK; ctx.fillRect(0, 0, w, h);
  x(ctx);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const face = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0 });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, DEPTH), [mat.edge, mat.edge, mat.edge, mat.edge, face, mat.edge]);
  m.position.set(w / 2, -h / 2, -DEPTH / 2); m.receiveShadow = true; m.castShadow = true;
  return m;
}
// a raised black plate with its own lettering on top (section names, buttons, title)
function plate(w, h, d, draw, opts = {}) {
  const [cv, ctx] = canvas(w, h);
  ctx.fillStyle = opts.bg || INK; ctx.fillRect(0, 0, w, h); draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  const top = opts.bg === PINK ? new THREE.MeshStandardMaterial({ map: tex, roughness: 0.78, metalness: 0 }) : new THREE.MeshLambertMaterial({ map: tex });
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [mat.inkMatte, mat.inkMatte, mat.inkMatte, mat.inkMatte, top, mat.inkMatte]);
  m.geometry.translate(w / 2, -h / 2, d / 2); m.castShadow = true; m.receiveShadow = true;
  m.userData.redraw = (f) => { ctx.fillStyle = opts.bg || INK; ctx.fillRect(0, 0, w, h); f(ctx, w, h); tex.needsUpdate = true; };
  return m;
}
// knob body: a turned profile, skirt then cap
// the bevel band between the knob's side and its cap, laid just over the body
const rimGeo = (() => {
  const p = [[KR + 0.06, 11.4], [KR - 0.2, 13.4], [KR - 1.5, 15.6], [KR - 3.0, 16.5], [KR - 3.6, 16.56]].map(([r, y]) => new THREE.Vector2(r, y));
  const g = new THREE.LatheGeometry(p, 64); g.rotateX(Math.PI / 2); return g;
})();
const knobGeo = (() => {
  const p = [[0, 0], [KR + 2.5, 0], [KR + 2.5, 2.5], [KR + 0.6, 4.5], [KR, 12], [KR - 1.6, 15.5], [KR - 3.5, 16.5], [0, 16.5]].map(([r, y]) => new THREE.Vector2(r, y));
  const g = new THREE.LatheGeometry(p, 48); g.rotateX(Math.PI / 2); return g;
})();
const pointerGeo = new THREE.BoxGeometry(3, KR - 4, 1.2); pointerGeo.translate(0, 3 + (KR - 4) / 2, 16.7);
const selBarGeo = new THREE.BoxGeometry(6, KR + 2, 1.4); selBarGeo.translate(0, (KR + 2) / 2, 16.9);
const selInGeo = new THREE.BoxGeometry(2, KR - 6, 1.6); selInGeo.translate(0, 2 + (KR - 6) / 2, 17.2);
const leverGeo = new THREE.BoxGeometry(14, 12, 9); leverGeo.translate(0, 0, 4.5);
const hits = [], OBJ = {};                       // things the pointer can grab

// ============================================================ upper panel
function cellsOf(b) {
  const occ = new Set(), out = [], m = b.m || (b.area[2] - b.area[0]);
  for (const it of b.items) if (it.at) { occ.add(it.at + ''); out.push([it, ...it.at]); }
  let i = 0;
  for (const it of b.items) {
    if (it.at) continue;
    let col, row;
    do { if (b.down) { col = Math.floor(i / m) + 1; row = i % m + 1; } else { col = i % b.n + 1; row = Math.floor(i / b.n) + 1; } i++; } while (occ.has([col, row] + ''));
    out.push([it, col, row]);
  }
  return out;
}
function label(ctx, s, x, y) { s.split('|').forEach((l, i) => text(ctx, l, x, y + 6 + i * 12, `600 10.5px ${MONO}`, INK, 'center', .7)); }
function paintKnob(ctx, c, x, y) {
  const cx = x + CW / 2, cy = y + TOP + CY;
  const n = c.scale === 'bip' ? 5 : 7;
  ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
  for (let i = 0; i < n; i++) { const a = ang(i / (n - 1)); ctx.beginPath(); ctx.moveTo(cx + Math.sin(a) * (KR + 5), cy - Math.cos(a) * (KR + 5)); ctx.lineTo(cx + Math.sin(a) * (KR + 9), cy - Math.cos(a) * (KR + 9)); ctx.stroke(); }
  // a soft dark ring where the knob meets the panel
  const g = ctx.createRadialGradient(cx, cy, KR, cx, cy, KR + 5); g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, KR + 5, 0, 7); ctx.fill();
  label(ctx, c.label, cx, y + TOP + 62 + 2);
  if (c.added) { ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.strokeRect(x + 3, y + 3, CW - 6, RH - 6); ctx.setLineDash([]); }
}
function paintSel(ctx, c, x, y) {
  const cx = x + CW / 2, cy = y + TOP + CY;
  c.opts.forEach((o, i) => {
    const a = selA(c, i), px = cx + Math.sin(a) * (KR + 11), py = cy - Math.cos(a) * (KR + 12);
    if (o.t) text(ctx, o.t, px, py, `600 10.5px ${MONO}`);
    else { ctx.strokeStyle = INK; ctx.lineWidth = 1.4; ctx.beginPath(); IC[o.i].forEach(([u, v], k) => ctx[k ? 'lineTo' : 'moveTo'](px - 8 + u, py - 6 + v)); ctx.stroke(); }
  });
  label(ctx, c.label, cx, y + TOP + 62 + 2);
}
function paintSwitch(ctx, c, x, y) {
  const cx = x + CW / 2;
  text(ctx, c.top, cx, y + TOP + 6, `500 10px ${MONO}`, INK, 'center', .6);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(cx - 9, y + TOP + 15, 18, 32);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(cx - 8, y + TOP + 16, 16, 30);
  text(ctx, c.bot, cx, y + TOP + 56, `500 10px ${MONO}`, INK, 'center', .6);
  if (c.label) label(ctx, c.label, cx, y + TOP + 62 + 2);
}
function paintResp(ctx, x, y) {
  const ox = x + 3, oy = y + TOP + 4, k = 72 / 96;
  const P2 = (pts, w, dash) => { ctx.lineWidth = w; ctx.setLineDash(dash ? [2, 2] : []); ctx.beginPath(); pts.forEach(([a, b], i) => ctx[i ? 'lineTo' : 'moveTo'](ox + a * k, oy + b * k)); ctx.stroke(); };
  ctx.strokeStyle = INK;
  const bp = P.fMode >= .5;
  P2([[6, 6], [6, 62], [92, 62]], 1.2); P2([[88, 59], [92, 62], [88, 65]], 1.2);
  P2([[6, 24], [44, 24], [52, 62]], bp ? 1 : 2.4, bp); P2([[40, 62], [52, 8], [62, 62]], bp ? 2.4 : 1, !bp); ctx.setLineDash([]);
  text(ctx, 'LP', ox + 14 * k, oy + 17 * k, `500 8.5px ${MONO}`, INK, 'left'); text(ctx, 'BP', ox + 64 * k, oy + 51 * k, `500 8.5px ${MONO}`, INK, 'left');
}
let respRedraw = null;
function buildUpper() {
  const ctls = [];
  const m = slab(UW, UH, (ctx) => {
    for (const b of BOXES) {
      const [r1, c1, r2, c2] = b.area, x0 = colX(c1), y0 = rowY(r1), x1 = colX(c2 - 1) + CW, y1 = rowY(r2 - 1) + RH;
      ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(x0 + 1, y0 + 1, x1 - x0 - 2, y1 - y0 - 2);
      for (const [c, col, row] of cellsOf(b)) {
        const x = colX(c1 + col - 1), y = rowY(r1 + row - 1);
        if (c.kind === 'knob') paintKnob(ctx, c, x, y); else if (c.kind === 'sel') paintSel(ctx, c, x, y);
        else if (c.kind === 'sw') paintSwitch(ctx, c, x, y);
        if (c.id) ctls.push([c, x, y]);
        if (c.kind === 'resp') respRedraw = [x, y];
      }
    }
  });
  upper.add(m);
  // filter response sketch: its own little plate so BP/LP can redraw it
  if (respRedraw) {
    const [x, y] = respRedraw, rp = plate(CW, 62, 0.4, () => {}, { bg: PINK });
    rp.castShadow = false; rp.position.copy(pos(x, y + TOP - 4, 0.05)); upper.add(rp);
    const draw = () => rp.userData.redraw((ctx) => paintResp(ctx, 0, -TOP + 4));
    draw(); view.push({ id: 'fMode', draw });
  }
  // section names: raised black slabs over the top edge of each box
  for (const b of BOXES) if (b.title) {
    const [r1, c1] = b.area;
    const ctx0 = document.createElement('canvas').getContext('2d'); ctx0.font = `400 14px ${DISPLAY}`;
    const w = Math.ceil(ctx0.measureText(b.title).width + 16 + b.title.length * .42);
    const p = plate(w, 21, 4, (ctx) => text(ctx, b.title, w / 2, 11.5, `400 14px ${DISPLAY}`, PAPER, 'center', .42));
    p.position.copy(pos(colX(c1) + 10, rowY(r1) - 10, 0)); upper.add(p);
  }
  // FILTH: a thick nameplate, tipped up toward you
  {
    const x0 = colX(16), y0 = rowY(1), w = colX(19) + CW - x0, h = RH;
    const p = plate(w, h, 18, () => {});
    p.add(titleFace(w, h));
    const hinge = new THREE.Group(); hinge.position.copy(pos(x0, y0 + h, 0)); hinge.rotation.x = 0.22;
    p.position.set(0, h, 0); hinge.add(p); upper.add(hinge);
    // a black skirt fills the gap under the tipped plate
    const skirt = new THREE.Mesh(new THREE.BoxGeometry(w, h, Math.sin(0.22) * h + 18), mat.inkMatte);
    skirt.position.copy(pos(x0 + w / 2, y0 + h / 2, (Math.sin(0.22) * h + 18) / 2 - 18)); skirt.castShadow = true;

    const a = TITLE.wobble ? 9 * TITLE.lfo / 1.43 : 0;
    titleU.amt.value = Math.abs(a) < .05 ? 0 : a;
    const l = titleU.lvl.value, k = TITLE.level > l ? 0.45 : 0.07;   // quick to light, slow to fade
    titleU.lvl.value = l + (TITLE.level - l) * k;
  }
  renderer.render(scene, camera);
}
</script>
</body>
